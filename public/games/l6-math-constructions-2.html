<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإنشاءات الهندسية (2) – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
const cm=x=>x.toFixed(1).replace('.',',');

/* رسومات */
function triArcs(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="20" cy="80" r="52" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><circle cx="100" cy="80" r="66" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>${L(20,80,100,80,'#1e293b',4)}${L(20,80,50,37,'#2563eb',3)}${L(100,80,50,37,'#f97316',3)}<circle cx="50" cy="37" r="4" fill="#16a34a"/><text x="12" y="97" font-size="11" fill="#475569">أ</text><text x="102" y="97" font-size="11" fill="#475569">ب</text><text x="50" y="28" font-size="11" fill="#14532d">ج</text></svg>`;
}
function freeTri(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M18 82 Q55 12 62 30 Q96 60 104 82 Z" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
function circLab(r,d){
 const rr=r===4?40:r===3?32:24;
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="44" r="${rr}" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="60" cy="44" r="3" fill="#dc2626"/>${L(60,44,60+rr,44,'#f97316',3)}<text x="60" y="90" font-size="11" text-anchor="middle" fill="#1e293b">نصف القطر ${r} سم · القطر ${d} سم</text></svg>`;
}
function squarePic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="20" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M30 20h10v10H30z M80 20h10v10H80z M30 70h10v10H30z M80 70h10v10H80z" fill="#fde047" stroke="#16a34a" stroke-width="1.5"/></svg>`;
}
function circlePic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="48" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><circle cx="60" cy="48" r="3" fill="#dc2626"/>${L(60,48,94,48,'#f97316',3)}<text x="60" y="92" font-size="11" text-anchor="middle" fill="#1e293b">نصف القطر 4 سم</text></svg>`;
}
function squareBuild(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(20,80,100,80,'#1e293b',4)}${L(20,80,20,20,'#2563eb',3,'stroke-dasharray="5 4"')}${L(100,80,100,20,'#2563eb',3,'stroke-dasharray="5 4"')}${L(20,20,100,20,'#16a34a',3)}<text x="60" y="96" font-size="11" text-anchor="middle" fill="#1e293b">عموديان + نقل الطول</text></svg>`;
}
function windowPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="18" width="60" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>${L(60,18,60,82,'#2563eb',3)}${L(30,50,90,50,'#2563eb',3)}</svg>`;
}
function wheelPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="50" r="34" fill="none" stroke="#1e293b" stroke-width="4"/><circle cx="60" cy="50" r="6" fill="#f97316"/>${[0,60,120].map(d=>L(60-30*Math.cos(d*Math.PI/180),50-30*Math.sin(d*Math.PI/180),60+30*Math.cos(d*Math.PI/180),50+30*Math.sin(d*Math.PI/180),'#475569',3)).join('')}</svg>`;
}
function roofPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M15 62 L60 20 L105 62 Z" fill="#fecaca" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><rect x="30" y="62" width="60" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="3"/></svg>`;
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نبني الأشكال معاً!');
 return `<div class="card c"><h1>الإنشاءات الهندسية (2)</h1><p>سنتعلم كيف ننشئ المثلث والمربع والمستطيل والدائرة بالمسطرة والبركار.</p><div class="row">${triArcs()}${circlePic()}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: رسم القطعة ثم قوسين من طرفيها',1],['في الصورة 1: رسم المثلث باليد الحرة',0],['في الصورة 2: المثلث مرسوم باليد الحرة دون أدوات',1],['في الصورة 2: المثلث مرسوم بالمسطرة والبركار',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>أراد سامي إنشاء مثلث أضلاعه 3 سم و4 سم و5 سم. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${triArcs()}الصورة 1</figure><figure>${freeTri()}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.cx=s.cx??200;s.cy=s.cy??60;s.g=s.g||{};say('اسحب النقطة الخضراء ج حتى تجد الرأس الثالث للمثلث.');
 return `<div class="card"><h2>نستكشف</h2><p>المثلث أضلاعه 3 سم و4 سم و5 سم. القطعة أ ب طولها 5 سم. اسحب النقطة ج حتى تبعد 3 سم عن أ و4 سم عن ب في آن واحد.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل هذه الإنشاءات حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${triArcs()}<p><b class="b">إنشاء المثلث</b>: نرسم القطعة الأطول، ثم قوسين من طرفيها، فتحدد نقطة تقاطعهما الرأس الثالث.</p></div><div>${squareBuild()}<p><b class="o">إنشاء المربع والمستطيل</b>: نرسم ضلعا، ثم عموديين على طرفيه، وننقل طول الضلع عليهما بالبركار.</p></div><div>${circlePic()}<p><b class="r">إنشاء الدائرة</b>: نضع إبرة البركار في المركز، ونفتحه على نصف القطر، ثم نديره دورة كاملة. والقطر ضعف نصف القطر.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${windowPic()}<figcaption>نافذة مربعة</figcaption></figure><figure>${wheelPic()}<figcaption>عجلة دائرية</figcaption></figure><figure>${roofPic()}<figcaption>سقف مثلث</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${r.pic}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: فتحة البركار هي نصف القطر، والقطر ضعف نصف القطر.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الإنشاءات الهندسية.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">تقاطع القوسين يحدد الرأس الثالث، وقطر الدائرة ضعف نصف قطرها.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[
 {pre:'لإنشاء المثلث، نقطة تقاطع القوسين هي',a:'الرأس الثالث',opts:['الرأس الثالث','المركز'],post:'للمثلث.',pic:triArcs(),h:'القوسان يحددان نقطة واحدة مشتركة: إنها الرأس الثالث للمثلث.'},
 {pre:'قطر الدائرة يساوي',a:'ضعف',opts:['ضعف','نصف'],post:'نصف قطرها.',pic:circlePic(),h:'القطر يمر بالمركز ويصل بين نقطتين على الدائرة، فهو ضعف نصف القطر.'}];
const Q=[
 {t:'ch',q:'لإنشاء مثلث أضلاعه 3 سم و4 سم و5 سم، بأي أداة نحدد الرأس الثالث؟',p:triArcs(),o:['بالمنقلة فقط','بالبركار: قوسان متقاطعان','بالكوس فقط','باليد الحرة'],a:1,why:'نرسم قوسا من كل طرف، ونقطة تقاطعهما هي الرأس الثالث.',h:'الرأس الثالث تحدده نقطة تقاطع قوسين.'},
 {t:'img',q:'اضغط على الصورة التي فيها دائرة نصف قطرها 4 سم وقطرها 8 سم.',o:[circLab(2,4),circLab(4,8),circLab(3,6)],a:1,why:'القطر ضعف نصف القطر: 4 × 2 = 8 سم.',h:'القطر يساوي ضعف نصف القطر.'},
 {t:'ch',q:'ما خاصية المربع؟',p:squarePic(),o:['أضلاعه الأربعة متساوية وزواياه الأربع قائمة','ضلعان فقط متساويان','زواياه كلها حادة','أضلاعه مختلفة'],a:0,why:'المربع أضلاعه الأربعة متساوية وزواياه الأربع قائمة.',h:'فكّر في نافذة مربعة: أضلاعها متساوية وزواياها قائمة.'},
 {t:'mt',q:'اضغط على صورة، ثم على الاسم المناسب لها.',it:[triArcs(),squarePic(),circlePic()],W:['إنشاء المثلث','إنشاء المربع','إنشاء الدائرة'],ws:[2,0,1],why:'المثلث يُبنى بقوسين متقاطعين، والمربع بعموديين ونقل الطول، والدائرة بالبركار.',h:'بأي أداة يُبنى كل شكل؟'},
 {t:'rt',T:4,q:'حرّك المنزلق حتى تصبح فتحة البركار 4 سم، لترسم دائرة نصف قطرها 4 سم، ثم اضغط «تحقق».',why:'فتحة البركار تساوي نصف القطر: 4 سم، فيكون قطر الدائرة 8 سم.',h:'فتحة البركار هي نصف القطر نفسه.'},
 {t:'ch',q:'لإنشاء مربع ضلعه 4 سم، بعد رسم الضلع الأول، ماذا نفعل؟',p:squareBuild(),o:['ننشئ عموديين على طرفيه وننقل طول 4 سم عليهما','نرسم قطريه فقط','نقيس زاوية 45°','نرسم دائرة حوله'],a:0,why:'زوايا المربع قائمة وأضلاعه متساوية، فننقل طول الضلع على العموديين.',h:'زوايا المربع قائمة، وأضلاعه متساوية.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل رسم المثلث يحتاج إلى أدوات؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],A={x:60,y:180},B={x:260,y:180};
 const dA=Math.hypot(s.cx-A.x,s.cy-A.y)/40,dB=Math.hypot(s.cx-B.x,s.cy-B.y)/40;
 const nearA=Math.abs(dA-3)<=0.3,nearB=Math.abs(dB-4)<=0.3,ok=nearA&&nearB;
 if(nearA)s.g.a=1;if(nearB)s.g.b=1;if(ok)s.g.v=1;
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
 g+=`<circle cx="${A.x}" cy="${A.y}" r="120" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/>`;
 g+=`<circle cx="${B.x}" cy="${B.y}" r="160" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 5"/>`;
 g+=L(A.x,A.y,B.x,B.y,'#1e293b',5);
 if(s.t){g+=L(A.x,A.y,s.cx,s.cy,'#2563eb',2,'stroke-dasharray="5 4"')+L(B.x,B.y,s.cx,s.cy,'#f97316',2,'stroke-dasharray="5 4"');}
 if(ok){g+=L(A.x,A.y,s.cx,s.cy,'#2563eb',4)+L(B.x,B.y,s.cx,s.cy,'#f97316',4);}
 g+=`<circle cx="${s.cx}" cy="${s.cy}" r="10" fill="#16a34a" stroke="#fff" stroke-width="3"/>`;
 g+=`<text x="${A.x-4}" y="${A.y+18}" font-size="13" font-weight="bold" fill="#1e293b">أ</text><text x="${B.x-2}" y="${B.y+18}" font-size="13" font-weight="bold" fill="#1e293b">ب</text><text x="${s.cx+12}" y="${s.cy+5}" font-size="13" font-weight="bold" fill="#14532d">ج</text>`;
 $('#ex').innerHTML=g;
 $('#msg').textContent=ok?'أحسنت! النقطة ج تبعد 3 سم عن أ و4 سم عن ب: إنها الرأس الثالث للمثلث.':s.t?`المسافة من أ: ${cm(dA)} سم · من ب: ${cm(dB)} سم. ابحث عن نقطة تبعد 3 سم عن أ و4 سم عن ب معا.`:'اسحب النقطة الخضراء ج، وتابع المسافتين.';
 $('#chips').innerHTML=[['a','القوس من أ (3 سم)'],['b','القوس من ب (4 سم)'],['v','الرأس الثالث']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.a&&s.g.b&&s.g.v){s.done=1;nav();say('رائع! وجدت الرأس الثالث بتقاطع القوسين. هيا نفسّر ما فعلناه.')}}
hooks[2]=()=>{const s=S[2],sv=$('#ex');exDraw();
 const mv=e=>{if(!s.drag)return;const b=sv.getBoundingClientRect();s.cx=Math.min(340,Math.max(20,(e.clientX-b.left)*360/b.width));s.cy=Math.min(210,Math.max(20,(e.clientY-b.top)*240/b.height));s.t=1;exDraw()};
 sv.onpointerdown=e=>{s.drag=1;sv.setPointerCapture(e.pointerId);mv(e)};sv.onpointermove=mv;sv.onpointerup=sv.onpointercancel=()=>{s.drag=0}};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${o}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`<div class="row">${q.p}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${o}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??5;b=`<svg id="rs" viewBox="0 0 360 220" class="board"></svg><input id="rr" type="range" min="1" max="8" step="0.1" value="${s.a}" dir="ltr" aria-label="فتحة البركار"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الاسم المناسب لهذه الصورة.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليست هذه الكلمة. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],T=Q[4].T,rg=$('#rr');
 const d=()=>{const r=s.a*20;
  $('#rs').innerHTML=`<rect width="360" height="220" fill="#f8fafc"/><circle cx="180" cy="110" r="80" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 5"/><circle cx="180" cy="110" r="${r}" fill="none" stroke="#f97316" stroke-width="4"/>${L(180,110,180+r,110,'#f97316',3)}<circle cx="180" cy="110" r="4" fill="#dc2626"/><text x="180" y="200" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">فتحة البركار: ${cm(s.a)} سم</text>`};
 d();rg.oninput=()=>{if(s.d)return;let a=+rg.value;if(Math.abs(a-T)<=0.2)a=T;s.a=a;rg.value=a;d()}};
function rchk(){const s=st(),q=Q[4];if(s.d)return;
 if(Math.abs(s.a-q.T)<=0.2)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
