<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحجوم – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');

/* رسومات */
function box3d(w,h,d){
 const x0=60-w/2-d*0.22,y0=56-h/2+d*0.15;
 return `<polygon points="${x0},${y0} ${x0+d*0.45},${y0-d*0.3} ${x0+w+d*0.45},${y0-d*0.3} ${x0+w},${y0}" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><polygon points="${x0+w},${y0} ${x0+w+d*0.45},${y0-d*0.3} ${x0+w+d*0.45},${y0+h-d*0.3} ${x0+w},${y0+h}" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>`;
}
function pic(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><g transform="rotate(${tilt} 60 50)">`;
 if(t=='cube')s+=box3d(44,44,44);
 if(t=='box')s+=box3d(64,36,30);
 if(t=='flat')s+=box3d(70,14,34);
 if(t=='unit')s+=box3d(30,30,30)+`<text x="60" y="94" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">1 سم</text>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الرياضيات. هيا نكتشف الحجوم معاً!');
 return `<div class="card c"><h1>الحجوم</h1><p>سنلاحظ ونجرّب ونكتشف كيف نحسب حجم المكعب ومتوازي المستطيلات.</p><div class="row">${pic('cube',-15)}${pic('box',15)}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الصندوق يتسع لمكعبات صغيرة',1],['في الصورة 1: الصندوق مسطح بلا ارتفاع',0],['في الصورة 2: كل أضلاع المكعب متساوية',1],['في الصورة 2: المكعب له ضلع واحد فقط',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>هذا صندوق ومكعب لعب. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${pic('box')}الصورة 1</figure><figure>${pic('cube')}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.L=s.L??2;s.l=s.l??3;s.h=s.h??4;s.g=s.g||{};say('حرّك المنزلقات لتغيير أبعاد الصندوق. ماذا يحدث للحجم؟');
 return `<div class="card"><h2>نستكشف</h2><p>غيّر الطول والعرض والارتفاع، ولاحظ كيف يتغير الحجم.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p>الطول: <b id="vL">${s.L} سم</b></p><input id="rL" type="range" min="1" max="5" step="1" value="${s.L}" dir="ltr" aria-label="الطول"><p>العرض: <b id="vl">${s.l} سم</b></p><input id="rl" type="range" min="1" max="5" step="1" value="${s.l}" dir="ltr" aria-label="العرض"><p>الارتفاع: <b id="vH">${s.h} سم</b></p><input id="rH" type="range" min="1" max="5" step="1" value="${s.h}" dir="ltr" aria-label="الارتفاع"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجدها حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${pic('box',-12)}<p><b class="b">متوازي المستطيلات</b>: حجمه = الطول × العرض × الارتفاع.</p></div><div>${pic('cube',14)}<p><b class="o">المكعب</b>: كل أضلاعه متساوية، وحجمه = الضلع × الضلع × الضلع.</p></div><div>${pic('unit',-8)}<p><b class="r">الوحدة</b>: الحجم يقاس بالسنتيمتر المكعب (سم³)، وهو حجم مكعب ضلعه 1 سم.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${pic('box',-10)}<figcaption>صندوق أحذية</figcaption></figure><figure>${pic('cube',10)}<figcaption>مكعب لعب</figcaption></figure><figure>${pic('flat',-5)}<figcaption>علبة مسطحة</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pic(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.choices.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: اضرب الأبعاد الثلاثة معاً، ولا تنس وحدة سم³.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الحجوم.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">حجم متوازي المستطيلات = الطول × العرض × الارتفاع، وحجم المكعب = الضلع × الضلع × الضلع.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{a:'الطول × العرض × الارتفاع',pre:'حجم متوازي المستطيلات =',post:'',t:'box',k:-8,choices:['الطول × العرض × الارتفاع','الطول + العرض + الارتفاع'],h:'نضرب الأبعاد الثلاثة معاً.'},
 {a:'الضلع × الضلع × الضلع',pre:'حجم المكعب =',post:'',t:'cube',k:8,choices:['الضلع × الضلع × الضلع','الضلع × الضلع'],h:'المكعب أضلاعه متساوية، فنضرب الضلع في نفسه ثلاث مرات.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها مكعب.',o:[['box',25],['cube',-18],['flat',8]],a:1,why:'كل أضلاع المكعب متساوية.',h:'ابحث عن الجسم الذي أضلاعه كلها متساوية.'},
 {t:'ch',q:'حجم متوازي المستطيلات يساوي؟',p:pic('box'),o:['الطول × العرض × الارتفاع','الطول + العرض + الارتفاع','الطول × العرض'],a:0,why:'حجم متوازي المستطيلات = الطول × العرض × الارتفاع.',h:'ما الأبعاد الثلاثة؟'},
 {t:'ch',q:'ما وحدة قياس الحجم؟',o:['سم²','سم³','سم'],a:1,why:'الحجم يقاس بالسنتيمتر المكعب (سم³).',h:'الحجم له ثلاثة أبعاد.'},
 {t:'mt',q:'اضغط على صورة، ثم على الاسم المناسب لها.',it:[['cube',20],['box',-25],['unit',10]],W:['مكعب','متوازي المستطيلات','سنتيمتر مكعب'],ws:[2,0,1],why:'المكعب أضلاعه متساوية، ومتوازي المستطيلات أبعاده مختلفة، والسنتيمتر المكعب وحدة الحجم.',h:'قارن الأضلاع والأبعاد.'},
 {t:'sl',q:'صندوق حجمه 24 سم³، عرضه 3 سم وارتفاعه 4 سم. حرّك المنزلق حتى تجد طوله، ثم اضغط «تحقق».',min:1,max:6,step:1,def:3,target:2,show:v=>'الطول '+v+' سم · الحجم '+(v*3*4)+' سم³',why:'الطول = 24 ÷ (3 × 4) = 24 ÷ 12 = 2 سم.',h:'اقسم الحجم على العرض والارتفاع.'},
 {t:'ch',q:'مكعب ضلعه 5 سم. حجمه؟',p:pic('cube'),o:['25 سم³','125 سم³','15 سم³'],a:1,why:'الحجم = 5 × 5 × 5 = 125 سم³.',h:'اضرب الضلع في نفسه ثلاث مرات.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل يلتقي الشارعان فعلاً؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],L=s.L,l=s.l,h=s.h,V=L*l*h;
 const W=20*L,H=20*h,D=20*l;
 const x0=180-(W+D*0.45)/2,y0=130-(H+D*0.3)/2;
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
 g+=`<polygon points="${x0},${y0} ${x0+D*0.45},${y0-D*0.3} ${x0+W+D*0.45},${y0-D*0.3} ${x0+W},${y0}" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>`;
 g+=`<polygon points="${x0+W},${y0} ${x0+W+D*0.45},${y0-D*0.3} ${x0+W+D*0.45},${y0+H-D*0.3} ${x0+W},${y0+H}" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>`;
 g+=`<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>`;
 g+=`<text x="${x0+W/2}" y="${y0+H+20}" font-size="13" font-weight="bold" fill="#2563eb" text-anchor="middle">الطول ${L} سم</text>`;
 g+=`<text x="${x0+W+D*0.45+4}" y="${y0+H/2}" font-size="13" font-weight="bold" fill="#2563eb">الارتفاع ${h} سم</text>`;
 $('#ex').innerHTML=g;
 $('#msg').textContent=s.t?`الطول ${L} سم · العرض ${l} سم · الارتفاع ${h} سم · الحجم ${V} سم³`:'حرّك المنزلقات لتغيير أبعاد الصندوق، ولاحظ الحجم.';
 $('#vL').textContent=L+' سم';$('#vl').textContent=l+' سم';$('#vH').textContent=h+' سم';
 if(s.t){s.g.f=1;if(L==l&&l==h)s.g.cube=1;if(V>=60)s.g.big=1;}
 $('#chips').innerHTML=[['f','الحجم = الطول × العرض × الارتفاع'],['cube','المكعب: كل أضلاعه متساوية'],['big','الحجم يكبر مع الأبعاد']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.f&&s.g.cube&&s.g.big){s.done=1;nav();say('أحسنت! اكتشفت قواعد الحجم. هيا نفسّرها.')}}
hooks[2]=()=>{const s=S[2];exDraw();
 [['rL','L'],['rl','l'],['rH','h']].forEach(([id,k])=>{const rg=document.getElementById(id);rg.oninput=()=>{s[k]=+rg.value;s.t=1;exDraw()}})};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pic(o[0],o[1])}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`<div class="row">${q.p||''}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pic(o[0],o[1])}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='sl'){s.a=s.a??q.def;b=`<div class="msg" id="sv"></div><input id="rr" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${s.a}" dir="ltr" aria-label="المنزلق"><div class="row"><button onclick="slchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الاسم المناسب لهذه الصورة.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليست هذه الكلمة. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],q=Q[4],rg=$('#rr');if(!rg)return;
 const show=()=>{$('#sv').textContent=q.show(s.a)};
 show();rg.oninput=()=>{if(s.d)return;s.a=+rg.value;show()}};
function slchk(){const s=st(),q=Q[4];if(s.d)return;
 if(Math.abs(s.a-q.target)<0.001)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
