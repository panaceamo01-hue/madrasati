<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التناسبية: النسبة ومعامل التناسب – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function orangesSVG(){
 let o='';
 [[45,45],[75,45],[60,70],[35,70],[85,70]].forEach(([x,y])=>{
  o+=`<circle cx="${x}" cy="${y}" r="14" fill="#f97316"/><path d="M${x} ${y-14}q4-6 10-4" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>`;
 });
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${o}</svg>`;
}
function tagSVG(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M30 30h45l25 25-45 45-25-25z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/><circle cx="42" cy="42" r="6" fill="#fff"/><text x="60" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">15 درهما</text></svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='mt-6kg')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">6 كغ بطاطس</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#475569">5 دراهم للكيلوغرام</text>`;
 if(t=='mt-3nb')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">3 دفاتر</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#475569">الثمن 18 درهما</text>`;
 if(t=='mt-7nb')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#2563eb">7 دفاتر</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#475569">الدفتر بـ 6 دراهم</text>`;
 if(t=='rule-price')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">الثمن = الكمية × 5</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#92400e">معامل التناسب 5</text>`;
 if(t=='rule-table')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">2 كغ ← 10 دراهم</text><text x="60" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">5 كغ ← 25 درهما</text>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة التناسبية. هيا نكتشف النسبة ومعامل التناسب معاً!');
 return `<div class="card c"><h1>التناسبية: النسبة ومعامل التناسب</h1><p>سنلاحظ ونجرّب ونكتشف كيف يتغير الثمن مع الكمية.</p><div class="row">${tile('3 كغ ← 15 درهما','ثمن الكيلوغرام 5 دراهم')}${tile('الثمن = الكمية × 5','معامل التناسب 5')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['ثمن الكيلوغرام الواحد 5 دراهم',1],['ثمن الكيلوغرام الواحد 3 دراهم',0],['ثمن 6 كغ من البرتقال 30 درهما',1],['ثمن 6 كغ من البرتقال 45 درهما',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>3 كيلوغرامات من البرتقال ثمنها 15 درهما. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${orangesSVG()}3 كيلوغرامات من البرتقال</figure><figure>${tagSVG()}الثمن 15 درهما</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.q=s.q??2;s.g=s.g||{};say('غيّر الكمية بالمنزلق، وشاهد كيف يتغير الثمن في الجدول.');
 return `<div class="card"><h2>نستكشف</h2><p>ثمن الكيلوغرام الواحد من البرتقال 5 دراهم. جرّب الكمية 1، ثم 5، ثم 10، ولاحظ الجدول.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p style="text-align:center;font-weight:bold">الكمية: <span id="qv"></span> كغ</p><input id="rg" type="range" min="1" max="10" value="${s.q}" dir="ltr" aria-label="الكمية"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل التناسبية حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${tile('3 كغ ← 15 درهما','1 كغ ← 5 دراهم')}<p><b class="b">النسبة</b>: هي العلاقة بين كميتين: الكمية وثمنها. ثمن الكيلوغرام الواحد هو 15 ÷ 3 = 5 دراهم.</p></div><div>${tile('الثمن = الكمية × 5','معامل التناسب 5')}<p><b class="o">معامل التناسب</b>: هو العدد الثابت الذي يتضاعف به الثمن عندما تتضاعف الكمية.</p></div><div>${tile('2 كغ ← 10 دراهم','5 كغ ← 25 درهما')}<p><b class="r">جدول التناسبية</b>: ننتقل من سطر إلى آخر بضرب معامل التناسب أو قسمته.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${tile('1 كغ تفاح','8 دراهم')}<figcaption>ثمن الفواكه في السوق</figcaption></figure><figure>${tile('4 علب عصير','20 درهما')}<figcaption>ثمن العصير</figcaption></figure><figure>${tile('3 دفاتر','18 درهما')}<figcaption>ثمن الأدوات المدرسية</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: معامل التناسب = الثمن ÷ الكمية.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل التناسبية.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">الثمن = الكمية × معامل التناسب، ومعامل التناسب ثابت.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'الثمن =',a:'الكمية × معامل التناسب',post:'.',t:'rule-price',k:-12,h:'معامل التناسب = الثمن ÷ الكمية، والثمن يساوي الكمية مضروبة في معامل التناسب.',o:['الكمية × معامل التناسب','الكمية + معامل التناسب']},
 {pre:'في جدول التناسبية، ننتقل من سطر إلى آخر بـ',a:'ضرب معامل التناسب أو قسمته',post:'.',t:'rule-table',k:14,h:'عندما تتضاعف الكمية، يتضاعف الثمن بنفس العدد، لا بجمعه.',o:['ضرب معامل التناسب أو قسمته','جمع معامل التناسب']}];
const Q=[
 {t:'ch',q:'ثمن الكيلوغرام الواحد من التفاح 8 دراهم. ما ثمن 3 كيلوغرامات؟',o:['24 درهما','16 درهما','32 درهما'],a:0,why:'3 × 8 = 24 درهما.',h:'اضرب الكمية في ثمن الكيلوغرام.'},
 {t:'ch',q:'ثمن 2 كيلوغرام من البطاطس 10 دراهم. ما معامل التناسب؟',o:['5','2','10'],a:0,why:'معامل التناسب = 10 ÷ 2 = 5.',h:'اقسم الثمن على الكمية.'},
 {t:'ch',q:'ثمن 4 علب عصير 20 درهما. ما ثمن العلبة الواحدة؟',o:['5 دراهم','4 دراهم','10 دراهم'],a:0,why:'20 ÷ 4 = 5 دراهم.',h:'اقسم 20 على 4.'},
 {t:'mt',q:'اضغط على صورة، ثم على الناتج المناسب لها.',it:[['mt-6kg',20],['mt-3nb',-25],['mt-7nb',10]],W:['30 درهما','6 دراهم','42 درهما'],ws:[2,0,1],why:'6 × 5 = 30 درهما، و18 ÷ 3 = 6 دراهم للدفتر، و7 × 6 = 42 درهما.',h:'احسب كل وضعية أولا.'},
 {t:'rt',T:5,min:1,max:10,q:'حرّك المنزلق ليصبح ثمن الكيلوغرام هو العدد الصحيح، فيصبح ثمن 10 كغ من البطاطس 50 درهما.',why:'معامل التناسب هو 5، إذن 10 × 5 = 50 درهما.',h:'اقسم 50 على 10.'},
 {t:'ch',q:'ثمن 3 دفاتر 18 درهما. ما ثمن 7 دفاتر؟',o:['42 درهما','36 درهما','54 درهما'],a:0,why:'ثمن الدفتر الواحد 6 دراهم، إذن 7 × 6 = 42 درهما.',h:'احسب ثمن الدفتر الواحد أولا.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: اقسم الثمن على الكمية.',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],q=s.q,p=5*q;
 if(s.t){if(q==1)s.g.one=1;if(q==5)s.g.five=1;if(q==10)s.g.ten=1}
 let rows='';
 [[1,5],[2,10],[3,15],[5,25],[10,50]].forEach(([kq,kp],r)=>{
  const cur=kq==q;
  rows+=`<rect x="40" y="${30+r*36}" width="280" height="32" rx="6" fill="${cur?'#dcfce7':'#fff'}" stroke="${cur?'#16a34a':'#cbd5e1'}" stroke-width="2"/><text x="110" y="${52+r*36}" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">${kq} كغ</text><text x="250" y="${52+r*36}" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">${kp} درهما</text>`;
 });
 $('#ex').innerHTML='<rect width="360" height="240" fill="#f8fafc"/><text x="110" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">الكمية</text><text x="250" y="20" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">الثمن</text>'+rows;
 $('#qv').textContent=q;
