<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قسمة الكسور – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;font-weight:bold}
.fr i{font-style:normal;padding:0 3px}
.fr i+i{border-top:2px solid currentColor}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
const fr=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`;

/* رسومات */
const flipSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">2/3</text><path d="M35 52h50m0 0-8-6m8 6-8 6" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round"/><text x="60" y="86" text-anchor="middle" font-size="22" font-weight="bold" fill="#f97316">3/2</text></svg>`;
const jugSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M50 10h20v14l8 10v54a6 6 0 0 1-6 6H48a6 6 0 0 1-6-6V34l8-10z" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="46" y="50" width="28" height="38" fill="#f97316"/><text x="60" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">3/4</text></svg>`;
const cupsSvg=()=>{let c='';for(let k=0;k<6;k++){const x=14+k*17;c+=`<path d="M${x} 55h14l-2 30a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z" fill="#fff" stroke="#2563eb" stroke-width="2.5"/><rect x="${x+2}" y="62" width="10" height="20" fill="#f97316"/>`;}return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${c}<text x="60" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">6 أكواب</text></svg>`};
const cakeSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="52" r="36" fill="#fde68a" stroke="#d97706" stroke-width="3"/>${L(60,16,60,88,'#d97706',3)}${L(60,52,96,52,'#d97706',3)}${L(60,52,85,27,'#dc2626',3)}<text x="60" y="44" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">1/2</text><text x="82" y="40" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">1/8</text></svg>`;
const clothSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${[0,1,2,3,4,5,6,7].map(k=>`<rect x="${10+k*13}" y="35" width="12" height="30" fill="${k<6?'#2563eb':'#e2e8f0'}" stroke="#fff" stroke-width="2"/>`).join('')}<text x="60" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">3/4 متر قماش</text></svg>`;
const expr=t=>`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="56" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e293b">${t}</text></svg>`;
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الرياضيات. هيا نكتشف قسمة الكسور معاً!');
 return `<div class="card c"><h1>قسمة الكسور</h1><p>سنلاحظ ونجرّب ونكتشف كيف نقسم كسراً على كسر أو على عدد صحيح.</p><div class="row">${flipSvg}${jugSvg}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['نحتاج إلى 6 أكواب لسكب كل العصير',1],['نقسم 3/4 لتر على 1/8 لتر',1],['ناتج القسمة هو 3/32',0],['نقسم البسط على البسط والمقام على المقام',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>عند سلمى 3/4 لتر عصير، تريد سكبه في أكواب سعة كل منها 1/8 لتر. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${jugSvg}عصير سلمى</figure><figure>${cupsSvg()}الأكواب</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.a=s.a??6;s.bi=s.bi??0;s.g=s.g||{};say('غيّر المقسوم والمقسوم عليه بالمنزلقين، ثم تحقق بالضرب. ماذا تلاحظ؟');
 return `<div class="card"><h2>نستكشف</h2><p>الشريط مقسّم إلى 8 أجزاء متساوية. الجزء الأزرق هو المقسوم، والخطوط البرتقالية تقسّمه إلى مجموعات بحجم المقسوم عليه.</p><svg id="ex" viewBox="0 0 360 140" class="board"></svg><label>المقسوم: <b id="la"></b></label><input id="rgA" type="range" min="2" max="6" step="2" value="${s.a}" dir="ltr" aria-label="المقسوم"><label>المقسوم عليه: <b id="lb"></b></label><input id="rgB" type="range" min="0" max="2" step="1" value="${s.bi}" dir="ltr" aria-label="المقسوم عليه"><div class="row"><button onclick="chk()">تحقق بالضرب</button></div><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد قسمة الكسور حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${flipSvg}<p><b class="b">مقلوب الكسر</b>: نبدّل البسط والمقام. مقلوب 2/3 هو 3/2، ومقلوب 1/4 هو 4، ومقلوب 5 هو 1/5.</p></div><div>${jugSvg}<p><b class="o">القسمة ضرب في المقلوب</b>: 3/4 ÷ 1/8 = 3/4 × 8/1 = 24/4 = 6 أكواب.</p></div><div>${cakeSvg}<p><b class="r">قسمة كسر على عدد صحيح</b>: 1/2 ÷ 4 = 1/2 × 1/4 = 1/8. والتحقق: 4 × 1/8 = 1/2.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${jugSvg}<figcaption>سكب العصير في الأكواب</figcaption></figure><figure>${cakeSvg}<figcaption>تقسيم نصف كعكة على الأصدقاء</figcaption></figure><figure>${clothSvg}<figcaption>قصّ 3/4 متر من القماش</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${r.mini}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: القسمة على كسر تتحول إلى ضرب في مقلوبه.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل قسمة الكسور.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">لقسمة كسر على كسر، نضرب في مقلوب المقسوم عليه.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[
 {a:'مقلوب',pre:'لقسمة كسر على كسر، نضرب الكسر الأول في',post:'الكسر الثاني.',opts:['مقلوب','البسط','المقام'],mini:flipSvg,h:'لا نقسم البسط على البسط؛ نضرب في مقلوب الكسر الثاني.'},
 {a:'مقلوب',pre:'لقسمة كسر على عدد صحيح، نضرب الكسر في',post:'العدد.',opts:['مقلوب','العدد نفسه','البسط'],mini:cakeSvg,h:'مقلوب العدد 4 هو 1/4، فنضرب 1/2 في 1/4.'}];
const DV=['1/8','1/4','1/2'],RC=['8','4','2'];
const Q=[
 {t:'ch',q:'ما مقلوب الكسر 2/3؟',p:flipSvg,o:['3/2','2/3','1/3','3/4'],a:0,why:'مقلوب الكسر نبدّل فيه البسط والمقام: مقلوب 2/3 هو 3/2.',h:'بدّل البسط والمقام.'},
 {t:'ch',q:'ما ناتج 1/2 ÷ 1/4؟',p:clothSvg,o:['1/8','1/2','2','1/4'],a:2,why:'1/2 ÷ 1/4 = 1/2 × 4/1 = 2.',h:'اضرب 1/2 في مقلوب 1/4 وهو 4.'},
 {t:'ch',q:'ما ناتج 3/4 ÷ 2/3؟',p:jugSvg,o:['1/2','9/8','6/7','2/3'],a:1,why:'3/4 × 3/2 = 9/8.',h:'مقلوب 2/3 هو 3/2.'},
 {t:'mt',q:'اضغط على عملية، ثم على ناتجها المناسب.',it:[expr('1/2 ÷ 1/4'),expr('3/4 ÷ 1/8'),expr('1/2 ÷ 4')],W:['2','6','1/8'],ws:[2,0,1],why:'1/2 ÷ 1/4 = 2، و3/4 ÷ 1/8 = 6، و1/2 ÷ 4 = 1/8.',h:'حوّل كل قسمة إلى ضرب في المقلوب.'},
 {t:'rt',T:6,q:'حرّك المنزلق حتى يصبح عدد الأكواب 6، ثم اضغط «تحقق».',why:'3/4 ÷ 1/8 = 6 أكواب.',h:'كل كوب سعته 1/8 لتر، ولدينا 3/4 لتر.'},
 {t:'ch',q:'ما ناتج 5/9 ÷ 5/3؟',p:flipSvg,o:['1/3','25/27','1','3/5'],a:0,why:'5/9 × 3/5 = 15/45 = 1/3.',h:'اضرب 5/9 في مقلوب 5/3 وهو 3/5.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل هذه الملاحظة صحيحة؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],A=s.a,bi=s.bi,B=[1,2,4][bi],dN=A/2,cnt=A/B;
 let cells='';for(let k=0;k<8;k++)cells+=`<rect x="${k*45+1}" y="30" width="43" height="70" fill="${k<A?'#2563eb':'#e2e8f0'}" stroke="#fff" stroke-width="2"/>`;
 let grp='';for(let k=0;k<=8;k+=B)grp+=L(k*45,24,k*45,106,'#f97316',4);
 const cstr=String(cnt).replace('.',',');
 $('#ex').innerHTML='<rect width="360" height="140" fill="#f8fafc"/>'+cells+grp+`<text x="180" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e293b">المقسوم ${dN}/4 · المقسوم عليه ${DV[bi]} · الناتج ${cstr}</text>`;
 $('#la').textContent=dN+'/4';$('#lb').textContent=DV[bi];
 $('#msg').textContent=s.ck?`التحقق: ${cstr} × ${DV[bi]} = ${dN}/4 — صحيح!`:s.t?`${dN}/4 ÷ ${DV[bi]} = ${dN}/4 × ${RC[bi]} = ${cstr}`:'جرّب: غيّر المقسوم أو المقسوم عليه بالمنزلقين.';
 $('#chips').innerHTML=[['flip','المقلوب'],['mul','الضرب في المقلوب'],['check','التحقق بالضرب']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.flip&&s.g.mul&&s.g.check){s.done=1;nav();say('أحسنت! اكتشفت قاعدة قسمة الكسور. هيا نفسّرها.')}}
