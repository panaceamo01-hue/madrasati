<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأعداد الكسرية – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
.sl{font-size:15px;font-weight:bold;color:#475569;text-align:center;margin:2px 0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function sector(cx,cy,r,n){
 const ex=n===1?cx+r:n===2?cx:cx-r, ey=n===1?cy:n===2?cy+r:cy;
 return `<path d="M${cx} ${cy} L${cx} ${cy-r} A${r} ${r} 0 ${n>2?1:0} 1 ${ex} ${ey} Z" fill="#f97316" stroke="#92400e" stroke-width="2"/>`;
}
function mixBoard(w,n){
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
 const cxs=[55,135,215,295];
 for(let k=0;k<4;k++){
  const cx=cxs[k],cy=90,r=30;
  if(k<w)g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f97316" stroke="#92400e" stroke-width="2"/>`;
  else if(k===w&&n>0){g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`+sector(cx,cy,r,n);}
  else g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>`;
 }
 g+=`<text x="180" y="170" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">العدد: ${n>0?w+' '+n+'/4':w}</text>`;
 return g;
}
function mixPic(w,n){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>`;
 const cxs=[17,46,75,104];
 for(let k=0;k<4;k++){
  const cx=cxs[k],cy=45,r=12;
  if(k<w)s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#f97316" stroke="#92400e" stroke-width="2"/>`;
  else if(k===w&&n>0){s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>`+sector(cx,cy,r,n);}
  else s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>`;
 }
 return s+'</svg>';
}
function pizzaOne(n){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="50" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>${sector(60,50,32,n)}</svg>`;
}
function cmpPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="30" cy="50" r="16" fill="#f97316" stroke="#92400e" stroke-width="2"/><circle cx="58" cy="50" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>${sector(58,50,16,2)}<text x="82" y="56" text-anchor="middle" font-size="18" font-weight="bold" fill="#16a34a">＞</text><circle cx="102" cy="50" r="12" fill="#f97316" stroke="#92400e" stroke-width="2"/></svg>`;
}
function ruler(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="15" y="38" width="90" height="24" fill="#fde68a" stroke="#92400e" stroke-width="2"/>${[25,35,45,55,65,75,85,95].map(x=>L(x,38,x,48,'#92400e',2)).join('')}<text x="60" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">قياس الطول</text></svg>`;
}
function scale(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(60,20,60,70,'#475569',3)}${L(30,28,90,28,'#475569',3)}${L(30,28,22,55,'#475569',2)}${L(30,28,38,55,'#475569',2)}${L(90,28,82,55,'#475569',2)}${L(90,28,98,55,'#475569',2)}<path d="M14 55a16 10 0 0 0 32 0z" fill="#2563eb"/><path d="M74 55a16 10 0 0 0 32 0z" fill="#f97316"/>${L(35,70,85,70,'#475569',3)}</svg>`;
}
function pic(t){
 if(t=='m2h')return mixPic(2,2);
 if(t=='m2q')return mixPic(2,1);
 if(t=='m1h')return mixPic(1,2);
 if(t=='m3h')return mixPic(3,2);
 if(t=='conv')return mixPic(2,2);
 return '';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الرياضيات. هيا نتعلم الأعداد الكسرية معاً!');
 return `<div class="card c"><h1>الأعداد الكسرية</h1><p>سنلاحظ ونجرّب ونكتشف كيف نقرأ الأعداد الكسرية ونحوّلها إلى كسور ونقارن بينها.</p><div class="row">${mixPic(2,2)}${pizzaOne(1)}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: أكلت سلمى بيتزتين ونصفاً',1],['في الصورة 1: أكلت سلمى بيتزا واحدة فقط',0],['في الصورة 2: القطعة المأخوذة هي الربع',1],['في الصورة 2: القطعة المأخوذة هي النصف',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>أكلت سلمى بيتزتين ونصف بيتزا مع أصدقائها. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${mixPic(2,2)}الصورة 1</figure><figure>${pizzaOne(1)}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.w=s.w??2;s.f=s.f??1;s.g=s.g||{};say('كوّن عدداً كسرياً باختيار عدد صحيح وكسر، ثم حوّله إلى كسر وقارنه.');
 return `<div class="card"><h2>نستكشف</h2><p>كوّن عدداً كسرياً باختيار عدد صحيح وكسر، ثم حوّله إلى كسر وقارنه مع 2 1/4 لتكتشف 3 حقائق.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p class="sl">العدد الصحيح</p><div class="row">${[0,1,2,3].map(w=>`<button class="opt${s.w===w?' ok':''}" onclick="exSet('w',${w})">${w}</button>`).join('')}</div><p class="sl">الكسر</p><div class="row">${['1/4','1/2','3/4'].map((f,k)=>`<button class="opt${s.f===k?' ok':''}" onclick="exSet('f',${k})">${f}</button>`).join('')}</div><div class="row"><button onclick="exConv()">حوّل إلى كسر</button><button onclick="exCmp()">قارن مع 2 1/4</button></div><div id="msg" class="msg"></div><div id="vals" class="tip"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل الأعداد الكسرية حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${mixPic(2,2)}<p><b class="b">العدد الكسري</b>: عدد صحيح وكسر، مثل 2 1/2، نقرؤه: اثنان ونصف.</p></div><div>${mixPic(2,2)}<p><b class="o">التحويل إلى كسر</b>: اضرب العدد الصحيح في المقام ثم أضف البسط: 2 1/2 = 5/2.</p></div><div>${cmpPic()}<p><b class="r">المقارنة</b>: إذا تساوى العدد الصحيح نقارن الكسر: النصف أكبر من الربع.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${pizzaOne(2)}<figcaption>بيتزا</figcaption></figure><figure>${ruler()}<figcaption>قياس الطول</figcaption></figure><figure>${scale()}<figcaption>الوزن</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pic(r.pic)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: اضرب ثم أضف: 2 × 2 + 1 = 5.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الأعداد الكسرية.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">العدد الكسري = عدد صحيح + كسر، وللتحويل اضرب ثم أضف.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'العدد الكسري فيه عدد صحيح و',post:'',a:'كسر',opts:['كسر','عدد صحيح آخر'],pic:'m2h',h:'العدد الكسري يجمع عدداً صحيحاً وكسراً.'},
 {pre:'للتحويل إلى كسر: اضرب العدد الصحيح في المقام ثم',post:'البسط',a:'أضف',opts:['أضف','اطرح'],pic:'conv',h:'نضرب ثم نضيف البسط لا نطرحه.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي تمثل 2 1/2.',o:['m2h','m2q','m1h'],a:0,why:'بيتزتان كاملتان ونصف بيتزا.',h:'عد البيتزات الكاملة ثم الجزء.'},
 {t:'ch',q:'2 1/2 تعني:',o:['2 + نصف','2 - نصف','2 × نصف'],a:0,why:'العدد الكسري يجمع عدداً صحيحاً وكسراً.',h:'العدد الكسري = عدد صحيح + كسر.'},
 {t:'ch',q:'1 1/4 يساوي:',o:['4/5','5/4','1/5'],a:1,why:'1 × 4 + 1 = 5، أي 5/4.',h:'اضرب 1 × 4 ثم أضف 1.'},
 {t:'mt',q:'اضغط على صورة، ثم على الكسر المناسب لها.',it:['m1h','m2q','m3h'],W:['3/2','9/4','7/2'],ws:[2,0,1],why:'للتحويل: اضرب العدد الصحيح في المقام ثم أضف البسط.',h:'اضرب ثم أضف.'},
 {t:'rt',T:10,min:0,max:12,step:1,def:6,q:'حرّك المنزلق حتى يصبح العدد 2 1/2، ثم اضغط «تحقق».',why:'2 1/2 تعني 10 أرباع.',h:'كم ربعاً في 2 1/2؟'},
 {t:'ch',q:'كم يساوي 3 2/3 ككسر؟',o:['11/3','9/3','10/3'],a:0,why:'3 × 3 + 2 = 11، أي 11/3.',h:'3 × 3 = 9 ثم + 2 = 11.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: كم بيتزا كاملة في الصورة؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],w=s.w,n=s.f+1,v=w+n/4;
 $('#ex').innerHTML=mixBoard(w,n);
 let val=`العدد: ${w} ${n}/4`;
 if(s.conv)val+=` = ${(w*4+n)}/4`;
 if(s.cmp){const c=v>2.25?'أكبر من':v<2.25?'أصغر من':'يساوي';val+=` · ${w} ${n}/4 ${c} 2 1/4`;}
 $('#vals').textContent=val;
 $('#msg').textContent=s.msg||'جرّب: اختر عدداً صحيحاً وكسراً، ثم حوّل وقارن.';
 $('#chips').innerHTML=[['mix','العدد الكسري = عدد صحيح + كسر'],['conv','للتحويل: اضرب ثم أضف'],['cmp','إذا تساوى العدد الصحيح نقارن الكسر']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.mix&&s.g.conv&&s.g.cmp){s.done=1;nav();say('أحسنت! اكتشفت الحقائق الثلاث. هيا نفسّرها.')}}
function exSet(kind,val){const s=S[2];
 if(kind=='w')s.w=val;else{s.f=val;s.g.mix=1;}
 s.msg=kind=='w'?`اخترت العدد الصحيح ${val}.`:`اخترت الكسر ${['1/4','1/2','3/4'][val]}.`;
 render();}
function exConv(){const s=S[2];s.g.conv=1;s.conv=1;s.msg=`للتحويل: اضرب ${s.w} × 4 ثم أضف ${s.f+1}، فتجد ${(s.w*4+s.f+1)}/4.`;render();}
function exCmp(){const s=S[2];s.g.cmp=1;s.cmp=1;s.msg='قارن أولا العدد الصحيح، ثم الكسر: النصف أكبر من الربع.';render();}
hooks[2]=()=>{exDraw()};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pic(o)}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`${q.p?`<div class="row">${q.p}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pic(o)}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??q.def;b=`<svg id="rs" viewBox="0 0 360 240" class="board"></svg><input id="rr" type="range" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${s.a}" dir="ltr" aria-label="القيمة"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الكسر المناسب لهذه الصورة.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليس هذا الكسر. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],rg=$('#rr');
 const d=()=>{const v=s.a,w=Math.floor(v/4),n=v%4;$('#rs').innerHTML=mixBoard(w,n)};
 d();rg.oninput=()=>{if(s.d)return;s.a=+rg.value;d()}};
function rchk(){const s=st(),q=Q[4];if(s.d)return;
 if(s.a===q.T)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
