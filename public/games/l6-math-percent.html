<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>النسبة المئوية – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function grid(p){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>`;
 for(let k=0;k<100;k++){s+=`<rect x="${10+(k%10)*10}" y="${Math.floor(k/10)*10}" width="9" height="9" fill="${k<p?'#2563eb':'#e2e8f0'}"/>`;}
 return s+'</svg>';
}
function pizzaQ(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="50" r="32" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><path d="M60 50 L60 18 A32 32 0 0 1 92 50 Z" fill="#f97316" stroke="#d97706" stroke-width="2"/>${L(60,50,60,18,'#d97706',2)}${L(60,50,92,50,'#d97706',2)}</svg>`;
}
function gridBoard(p){
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
 for(let k=0;k<100;k++){g+=`<rect x="${30+(k%10)*30}" y="${10+Math.floor(k/10)*20}" width="28" height="18" fill="${k<p?'#2563eb':'#e2e8f0'}" stroke="#fff" stroke-width="1"/>`;}
 g+=`<text x="180" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">${p}% = ${p} من 100 · ${p}% من 40 = ${40*p/100}</text>`;
 return g;
}
function examPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="10" width="60" height="80" fill="#fff" stroke="#94a3b8" stroke-width="2"/>${[28,40,52].map(y=>L(38,y,82,y,'#cbd5e1',2)).join('')}<text x="60" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#16a34a">75%</text></svg>`;
}
function tagPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="30,30 70,30 95,55 60,90 30,60" fill="#f97316" stroke="#92400e" stroke-width="2"/><circle cx="42" cy="42" r="5" fill="#fff"/><text x="58" y="66" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">-30%</text></svg>`;
}
function pollPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="25" y="55" width="16" height="30" fill="#2563eb"/><rect x="52" y="40" width="16" height="45" fill="#f97316"/><rect x="79" y="25" width="16" height="60" fill="#16a34a"/>${L(20,85,100,85,'#475569',2)}<text x="33" y="50" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">30%</text><text x="60" y="35" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">50%</text><text x="87" y="20" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">75%</text></svg>`;
}
function pic(t){
 if(t=='g10')return grid(10);
 if(t=='g20')return grid(20);
 if(t=='g25')return grid(25);
 if(t=='g50')return grid(50);
 if(t=='g75')return grid(75);
 if(t=='pizza')return pizzaQ();
 return '';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الرياضيات. هيا نتعلم النسبة المئوية معاً!');
 return `<div class="card c"><h1>النسبة المئوية</h1><p>سنلاحظ ونجرّب ونكتشف معنى النسبة المئوية وكيف نحسبها من أي عدد.</p><div class="row">${grid(50)}${pizzaQ()}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الجزء الملون هو ثلاثة أرباع المربعات',1],['في الصورة 1: الجزء الملون هو النصف',0],['في الصورة 2: الجزء الملون هو الربع',1],['في الصورة 2: الجزء الملون هو النصف',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>في القسم 40 تلميذاً، نجح 30 منهم. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${grid(75)}الصورة 1</figure><figure>${pizzaQ()}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.p=s.p??50;s.g=s.g||{};say('حرّك المنزلق لتغيير النسبة. ماذا تلاحظ؟');
 return `<div class="card"><h2>نستكشف</h2><p>هذه 100 مربع. حرّك المنزلق لتلوين نسبة منها، واكتشف 3 حقائق: العشر والربع والنصف.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><input id="rg" type="range" min="0" max="100" step="5" value="${s.p}" dir="ltr" aria-label="النسبة"><div id="msg" class="msg"></div><div id="vals" class="tip"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد النسب المئوية حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${grid(25)}<p><b class="b">معنى النسبة</b>: النسبة المئوية جزء من 100. 25% تعني 25 من كل 100، أي الربع.</p></div><div>${grid(20)}<p><b class="o">كيف نحسبها؟</b>: نضرب العدد في النسبة ثم نقسم على 100. مثال: 20% من 50 تساوي 10.</p></div><div>${examPic()}<p><b class="r">انتبه!</b> 10% هي العشر: اقسم العدد على 10.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${examPic()}<figcaption>نتائج الامتحانات</figcaption></figure><figure>${tagPic()}<figcaption>التخفيضات في المتاجر</figcaption></figure><figure>${pollPic()}<figcaption>استطلاعات الرأي</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pic(r.pic)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: 10% هي العشر، و25% هي الربع، و50% هي النصف.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل النسبة المئوية.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">النسبة المئوية جزء من 100: اضرب العدد في النسبة ثم اقسم على 100.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'النسبة المئوية جزء من',post:'',a:'100',opts:['100','10'],pic:'g25',h:'النسبة المئوية جزء من 100 لا من 10.'},
 {pre:'لحساب نسبة من عدد: العدد × النسبة ÷',post:'',a:'100',opts:['100','10'],pic:'g20',h:'نقسم على 100 لأن النسبة من 100.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي تمثل 25%.',o:['g25','g50','g75'],a:0,why:'25 مربعاً ملوناً من 100، أي الربع.',h:'عد المربعات الملونة من 100.'},
 {t:'ch',q:'50% تعني:',o:['النصف','الربع','العشر'],a:0,why:'50 من 100 هي النصف.',h:'50 من 100.'},
 {t:'ch',q:'10% من 80 = ؟',o:['8','80','18'],a:0,why:'10% هي العشر: 80 ÷ 10 = 8.',h:'10% هي العشر، اقسم 80 على 10.'},
 {t:'mt',q:'اضغط على صورة، ثم على الاسم المناسب لها.',it:['g10','g25','g50'],W:['العشر','الربع','النصف'],ws:[2,0,1],why:'10% هي العشر، و25% هي الربع، و50% هي النصف.',h:'عد المربعات الملونة من 100.'},
 {t:'rt',T:25,min:0,max:100,step:5,def:10,q:'حرّك المنزلق حتى تلوّن 25% من المربعات، ثم اضغط «تحقق».',why:'25 مربعاً من 100 هي 25%.',h:'25% تعني 25 مربعاً من 100.'},
 {t:'ch',q:'إذا نجح 30 تلميذاً من 40، فالنسبة هي:',o:['50%','75%','60%'],a:1,why:'30 ÷ 40 = 0,75 أي 75%.',h:'30 ÷ 40 = 0,75 أي 75%.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: كم مربعاً ملوناً من 100؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],p=s.p;
 $('#ex').innerHTML=gridBoard(p);
 const nm=p===10?'العشر':p===25?'الربع':p===50?'النصف':p===100?'الكل':'';
 $('#msg').textContent=s.msg||'جرّب: حرّك المنزلق لتغيير النسبة.';
 $('#vals').textContent=nm?`${p}% هي ${nm}.`:'';
 $('#chips').innerHTML=[['ten','10% هي العشر'],['q','25% هي الربع'],['half','50% هي النصف']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.ten&&s.g.q&&s.g.half){s.done=1;nav();say('أحسنت! اكتشفت الحقائق الثلاث. هيا نفسّرها.')}}
hooks[2]=()=>{const s=S[2],rg=$('#rg');exDraw();
 rg.oninput=()=>{s.p=+rg.value;s.t=1;
  if(s.p===10)s.g.ten=1;
  if(s.p===25)s.g.q=1;
  if(s.p===50)s.g.half=1;
  s.msg=`لوّنت ${s.p}% من المربعات: ${s.p} مربعاً من 100.`;
  exDraw()}};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pic(o)}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`${q.p?`<div class="row">${q.p}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
