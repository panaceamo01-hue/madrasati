<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>التوازي والتعامد – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><g transform="rotate(${tilt} 60 50)">`;
 if(t=='par')s+=L(-60,32,180,32,'#2563eb')+L(-60,68,180,68,'#f97316');
 if(t=='perp')s+=L(-60,50,180,50,'#2563eb')+L(60,-60,60,160,'#f97316')+(mark?'<path d="M60 50h12v12h-12z" fill="#fde04799" stroke="#16a34a" stroke-width="2"/>':'');
 if(t=='cross')s+=L(-60,50,180,50,'#2563eb')+L(-60,50,180,50,'#f97316',4,'transform="rotate(58 60 50)"');
 return s+'</g></svg>';
}
function streets(t){
 const rd=(a,b,c,d)=>L(a,b,c,d,'#475569',26)+L(a,b,c,d,'#fff',3,'stroke-dasharray="10 9"');
 const hs=(x,y)=>`<rect x="${x}" y="${y}" width="28" height="22" rx="3" fill="#fb923c"/><path d="M${x-3} ${y}l17-13 17 13z" fill="#dc2626"/>`;
 return `<svg viewBox="0 0 320 200" class="st" role="img"><rect width="320" height="200" rx="14" fill="#bbf7d0"/>${t=='par'?rd(-10,55,330,55)+rd(-10,145,330,145)+hs(40,88)+hs(150,88)+hs(250,88):rd(-10,100,330,100)+rd(160,-10,160,210)+hs(40,40)+hs(230,40)+hs(40,142)+hs(230,142)}</svg>`;
}
const tiles=h=>`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>${[24,48,72,96].map(x=>L(x,0,x,100,'#d97706',2)).join('')}${[20,40,60,80].map(y=>L(0,y,120,y,'#d97706',2)).join('')}${h?L(72,0,72,100,'#dc2626',6)+L(0,60,120,60,'#dc2626',6):''}</svg>`;
const notebook=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>${[25,40,55,70,85].map(y=>L(8,y,112,y,'#60a5fa',2)).join('')}${L(95,6,95,94,'#ef4444',2.5)}</svg>`;
const board=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#e2e8f0"/><rect x="12" y="14" width="96" height="62" rx="3" fill="#166534" stroke="#92400e" stroke-width="6"/><path d="M95 17v10h10" fill="none" stroke="#fff" stroke-width="2.5"/>${L(20,86,100,86,'#92400e',5)}</svg>`;
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نكتشف الخطوط معاً!');
 return `<div class="card c"><h1>التوازي والتعامد</h1><p>سنلاحظ ونجرّب ونكتشف كيف تكون الخطوط متوازية أو متعامدة.</p><div class="row">${pair('par',-15)}${pair('perp',15,1)}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الشارعان يلتقيان في آخرهما',0],['في الصورة 1: الشارعان لا يلتقيان مهما امتدّا',1],['في الصورة 2: الشارعان لا يلتقيان',0],['في الصورة 2: الشارعان يلتقيان بزاوية مثل ركن الدفتر',1]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>هذه شوارع مدينة صغيرة. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${streets('par')}الصورة 1</figure><figure>${streets('perp')}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.a=s.a??40;s.cx=s.cx??180;s.cy=s.cy??190;s.g=s.g||{};say('اسحب المستقيم البرتقالي، وغيّر اتجاهه بالمنزلق. ماذا يحدث؟');
 return `<div class="card"><h2>نستكشف</h2><p>حرّك المستقيم البرتقالي حتى تكتشف 3 حالات مختلفة بينه وبين المستقيم الأزرق.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><input id="rg" type="range" min="0" max="180" value="${s.a}" dir="ltr" aria-label="اتجاه المستقيم"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجدهما حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${pair('par',-12)}<p><b class="b">متوازيان</b>: لا يلتقيان مهما امتدّا.</p></div><div>${pair('perp',14,1)}<p><b class="o">متعامدان</b>: يلتقيان بزاوية قائمة (90°)، ونرمز لها بمربع صغير.</p></div><div>${pair('cross',-8)}<p><b class="r">انتبه!</b> هذان المستقيمان يلتقيان، لكن الزاوية ليست قائمة. إذن هما متقاطعان فقط، وليسا متعامدين.</p></div></div><h3>أين نجدهما حولنا؟</h3><div class="exp"><figure>${notebook}<figcaption>خطوط الدفتر: متوازية</figcaption></figure><figure>${board}<figcaption>حافتا السبورة: متعامدتان</figcaption></figure><figure>${tiles(0)}<figcaption>بلاط الأرضية: متوازٍ ومتعامد</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>المستقيمان <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>المستقيمان <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${['متوازيان','متعامدان'].map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: مجرد التقاطع لا يعني التعامد.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل التوازي والتعامد.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">المتوازيان لا يلتقيان، والمتعامدان يلتقيان بزاوية قائمة (90°).</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{a:'متوازيان',t:'par',k:-12,post:'لا يلتقيان مهما امتدّا.',h:'المتعامدان يلتقيان بزاوية قائمة، أما هنا فالمستقيمان لا يلتقيان أبداً.'},
 {a:'متعامدان',t:'perp',k:14,post:'يلتقيان بزاوية قائمة (90°).',h:'المتوازيان لا يلتقيان أبداً، أما هنا فالمستقيمان يلتقيان بزاوية قائمة.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها مستقيمان متعامدان.',o:[['par',25],['perp',-18],['cross',8]],a:1,why:'المستقيمان يلتقيان بزاوية قائمة (90°)، لذلك هما متعامدان.',h:'المتعامدان يلتقيان بزاوية قائمة مثل ركن الدفتر.'},
 {t:'img',q:'اضغط على الصورة التي فيها مستقيمان متوازيان.',o:[['cross',-30],['perp',32],['par',-20]],a:2,why:'المستقيمان لا يلتقيان مهما امتدّا، لذلك هما متوازيان.',h:'المتوازيان لا يلتقيان أبداً.'},
 {t:'ch',q:'مستقيمان يتقاطعان لكن الزاوية بينهما ليست قائمة. هل هما متعامدان؟',p:pair('cross',12),o:['نعم، لأنهما يتقاطعان','لا، هما متقاطعان فقط'],a:1,why:'مجرد التقاطع لا يعني التعامد؛ يجب أن تكون الزاوية قائمة (90°).',h:'التعامد يحتاج إلى زاوية قائمة وليس مجرد التقاطع.'},
 {t:'mt',q:'اضغط على صورة، ثم على الاسم المناسب لها.',it:[['par',20],['perp',-25],['cross',10]],W:['متوازيان','متعامدان','متقاطعان فقط'],ws:[2,0,1],why:'المتوازيان لا يلتقيان، والمتعامدان يلتقيان بزاوية قائمة، والمتقاطعان فقط يلتقيان بزاوية غير قائمة.',h:'هل يلتقي المستقيمان؟ وإذا التقيا، هل الزاوية قائمة؟'},
 {t:'rt',T:25,q:'حرّك المستقيم البرتقالي ليصبح متعامداً مع المستقيم الأزرق، ثم اضغط «تحقق».',why:'المستقيمان يلتقيان بزاوية قائمة (90°) مثل ركن الدفتر، فهما متعامدان.',h:'ابحث عن وضع يشبه ركن الدفتر تماماً.'},
 {t:'ch',q:'في بلاط الأرضية، الخطان الأحمران:',p:tiles(1),o:['متوازيان','متعامدان','متقاطعان فقط'],a:1,why:'يلتقي الخطان بزاوية قائمة مثل زاوية البلاطة، لذلك هما متعامدان.',h:'انظر إلى زاوية البلاطة: هل هي قائمة؟'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل يلتقي الشارعان فعلاً؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],{a,cx,cy}=s,par=a<=3||a>=177,pp=Math.abs(a-90)<=3,an=a>90?180-a:a;let k=null,m;
 let g='<rect width="360" height="240" fill="#f8fafc"/>'+L(0,120,360,120,'#2563eb',6)+L(cx-500,cy,cx+500,cy,'#f97316',6,`transform="rotate(${a} ${cx} ${cy})"`);
 if(par&&Math.abs(cy-120)<12)m='انطبق المستقيمان! حرّك المستقيم البرتقالي بعيداً.';
 else if(par){k='par';m='متوازيان: لا يلتقيان مهما امتدّا.'}
 else if(pp){k='perp';g+=`<path d="M${cx} 120h16v16h-16z" fill="#fde04799" stroke="#16a34a" stroke-width="3"/>`;m='متعامدان: يلتقيان بزاوية قائمة (90°).'}
 else if(an<12||Math.abs(an-90)<12)m='اقتربت! هل هما متوازيان أم متعامدان تماماً؟ حرّك قليلاً.';
 else{k='cross';const x=cx+(120-cy)/Math.tan(a*Math.PI/180);if(x>0&&x<360)g+=`<circle cx="${x}" cy="120" r="7" fill="#dc2626"/>`;m=`يتقاطعان، لكن الزاوية (${Math.round(an)}°) ليست قائمة: ليسا متعامدين.`}
 if(k&&s.t)s.g[k]=1;
 $('#ex').innerHTML=g;$('#msg').textContent=s.t?m:'جرّب: اسحب المستقيم البرتقالي، أو غيّر اتجاهه بالمنزلق.';
