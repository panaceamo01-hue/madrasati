<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الزوايا ومنصفها – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function ang(deg,lab=false){
 const r=55,cx=60,cy=78;
 const x2=(cx+r*Math.cos(deg*Math.PI/180)).toFixed(1),y2=(cy-r*Math.sin(deg*Math.PI/180)).toFixed(1);
 const ax=(cx+26*Math.cos(deg*Math.PI/180)).toFixed(1),ay=(cy-26*Math.sin(deg*Math.PI/180)).toFixed(1);
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(cx,cy,115,cy,'#2563eb')}${L(cx,cy,x2,y2,'#f97316')}<path d="M${cx+26} ${cy} A26 26 0 0 0 ${ax} ${ay}" fill="none" stroke="#1e293b" stroke-width="2"/>`;
 if(deg===90)s+=`<path d="M${cx} ${cy-14}h14v14" fill="none" stroke="#16a34a" stroke-width="3"/>`;
 if(lab)s+=`<text x="60" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">${deg}°</text>`;
 return s+'</svg>';
}
function bis(deg){
 const r=55,cx=60,cy=78,half=deg/2;
 const p=a=>[(cx+r*Math.cos(a*Math.PI/180)).toFixed(1),(cy-r*Math.sin(a*Math.PI/180)).toFixed(1)];
 const [x1,y1]=p(deg),[x2,y2]=p(half);
 const [ax,ay]=[cx+26*Math.cos(deg*Math.PI/180),cy-26*Math.sin(deg*Math.PI/180)];
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(cx,cy,115,cy,'#2563eb')}${L(cx,cy,x1,y1,'#f97316')}<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#16a34a" stroke-width="3" stroke-dasharray="6 4"/><path d="M${cx+26} ${cy} A26 26 0 0 0 ${ax.toFixed(1)} ${ay.toFixed(1)}" fill="none" stroke="#1e293b" stroke-width="2"/><text x="60" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">${half}° + ${half}°</text></svg>`;
}
function clock(h){
 const a=h*30*Math.PI/180,cx=60,cy=50;
 const hx=(cx+20*Math.sin(a)).toFixed(1),hy=(cy-20*Math.cos(a)).toFixed(1);
 let ticks='';for(let k=0;k<12;k++){const t=k*30*Math.PI/180;ticks+=L((cx+30*Math.sin(t)).toFixed(1),(cy-30*Math.cos(t)).toFixed(1),(cx+34*Math.sin(t)).toFixed(1),(cy-34*Math.cos(t)).toFixed(1),'#94a3b8',2);}
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="50" r="36" fill="#fff" stroke="#2563eb" stroke-width="3"/>${ticks}${L(60,50,hx,hy,'#1e293b',4)}${L(60,50,60,22,'#f97316',3)}<circle cx="60" cy="50" r="4" fill="#1e293b"/></svg>`;
}
const protSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M20 82 A40 40 0 0 1 100 82 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>${L(60,82,80,47,'#f97316')}<circle cx="60" cy="82" r="4" fill="#1e293b"/><text x="60" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">60°</text><text x="22" y="96" font-size="12" fill="#475569">0°</text><text x="54" y="30" font-size="12" fill="#475569">90°</text><text x="88" y="96" font-size="12" fill="#475569">180°</text></svg>`;
const bookSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(25,88,25,25,'#2563eb',6)}${L(25,88,95,88,'#2563eb',6)}<path d="M25 74h14v14" fill="none" stroke="#16a34a" stroke-width="3"/><text x="60" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">90°</text></svg>`;
const doorSvg=`<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${L(25,88,95,88,'#475569',4)}${L(60,88,60,22,'#475569',4)}${L(60,88,38,49,'#f97316',5)}<path d="M60 88 A66 66 0 0 0 38 49" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="5 4"/><circle cx="60" cy="88" r="4" fill="#1e293b"/><text x="70" y="40" font-size="14" font-weight="bold" fill="#1e293b">120°</text></svg>`;
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نكتشف الزوايا ومنصفها معاً!');
 return `<div class="card c"><h1>الزوايا ومنصفها</h1><p>سنلاحظ ونجرّب ونكتشف أنواع الزوايا وكيف نقسم الزاوية إلى نصفين متساويين.</p><div class="row">${ang(80,true)}${bis(80)}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الزاوية بين العقربين حادة',1],['في الصورة 2: الزاوية بين العقربين منفرجة',1],['في الصورة 1: الزاوية بين العقربين قائمة',0],['في الصورة 2: الزاوية بين العقربين حادة',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>هذه ساعة حائط في وقتين مختلفين. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${clock(1)}الصورة 1: الواحدة</figure><figure>${clock(5)}الصورة 2: الخامسة</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.a=s.a??80;s.g=s.g||{};say('اسحب الشعاع البرتقالي، وغيّر قياس الزاوية بالمنزلق. ماذا يحدث للمنصف؟');
 return `<div class="card"><h2>نستكشف</h2><p>حرّك الشعاع البرتقالي حتى تكتشف 3 أنواع مختلفة من الزوايا، ولاحظ كيف يتبعه المنصف الأخضر.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><input id="rg" type="range" min="5" max="175" step="1" value="${s.a}" dir="ltr" aria-label="قياس الزاوية"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد الزوايا حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div><div class="row">${ang(45,true)}${ang(90,true)}${ang(120,true)}</div><p><b class="b">أنواع الزوايا</b>: الحادة أصغر من 90°، والقائمة 90° تماما، والمنفرجة أكبر من 90° وأصغر من 180°، والمستقيمة 180°، والكاملة 360°.</p></div><div>${protSvg}<p><b class="o">قياس الزاوية بالمنقلة</b>: نضع مركز المنقلة على رأس الزاوية، ونجعل الصفر على أحد ضلعيها، ثم نقرأ التدريج عند الضلع الآخر.</p></div><div>${bis(80)}<p><b class="r">منصف الزاوية</b>: نصف مستقيم يخرج من رأس الزاوية ويقسمها إلى زاويتين متساويتين. منصف زاوية 80° يقسمها إلى 40° و40°.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${clock(3)}<figcaption>عقربا الساعة عند الثالثة: قائمة</figcaption></figure><figure>${bookSvg}<figcaption>ركن الكتاب: قائمة</figcaption></figure><figure>${doorSvg}<figcaption>باب مفتوح: منفرجة</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${r.mini}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: قارن الزاوية بالزاوية القائمة لتعرف نوعها.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الزوايا ومنصفها.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">الحادة أصغر من 90°، والقائمة 90°، والمنفرجة أكبر من 90°، والمنصف يقسم الزاوية إلى نصفين متساويين.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[
 {a:'أصغر',pre:'الزاوية الحادة قياسها',post:'من 90°.',opts:['أصغر','أكبر'],mini:ang(45,true),h:'الحادة أصغر من القائمة، والمنفرجة أكبر منها.'},
 {a:'متساويتين',pre:'منصف الزاوية يقسمها إلى زاويتين',post:'في القياس.',opts:['متساويتين','مختلفتين'],mini:bis(80),h:'المنصف يقسم الزاوية إلى نصفين متساويين تماما.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها زاوية حادة.',o:[ang(45),ang(90),ang(120)],a:0,why:'45° أصغر من 90°، لذلك هي زاوية حادة.',h:'الحادة أصغر من 90°.'},
 {t:'img',q:'اضغط على الصورة التي فيها زاوية منفرجة.',o:[ang(30),ang(90),ang(135)],a:2,why:'135° أكبر من 90° وأصغر من 180°، لذلك هي زاوية منفرجة.',h:'المنفرجة أكبر من 90°.'},
 {t:'ch',q:'منصف زاوية قياسها 80° يقسمها إلى زاويتين قياس كل منهما:',p:bis(80),o:['80°','40°','20°','160°'],a:1,why:'80° ÷ 2 = 40°.',h:'اقسم 80° على 2.'},
 {t:'mt',q:'اضغط على صورة، ثم على النوع المناسب لها.',it:[ang(45),ang(90),ang(120)],W:['حادة','قائمة','منفرجة'],ws:[2,0,1],why:'الحادة أصغر من 90°، والقائمة 90°، والمنفرجة أكبر من 90°.',h:'قارن كل زاوية بالزاوية القائمة.'},
 {t:'rt',T:90,q:'حرّك الشعاع حتى يصبح قياس الزاوية 90°، ثم اضغط «تحقق».',why:'الزاوية القائمة قياسها 90° تماما مثل ركن الدفتر.',h:'ابحث عن وضع يشبه ركن الدفتر تماماً.'},
 {t:'ch',q:'منصف زاوية قياسها 100° يقسمها إلى زاويتين قياس كل منهما:',p:bis(100),o:['100°','25°','50°','200°'],a:2,why:'100° ÷ 2 = 50°.',h:'اقسم 100° على 2.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى إلى عقربي الساعة.',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],a=s.a,rad=a*Math.PI/180,hr=rad/2;
 const x2=(180+150*Math.cos(rad)).toFixed(1),y2=(200-150*Math.sin(rad)).toFixed(1);
 const bx=(180+120*Math.cos(hr)).toFixed(1),by=(200-120*Math.sin(hr)).toFixed(1);
