<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المضاعفات – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function numStrip(vals,mark,col){
 const w=vals.length*44;
 const cells=vals.map((v,k)=>`<rect x="${k*44+2}" y="6" width="40" height="40" rx="8" fill="${mark.includes(k)?col:'#ffffff'}" stroke="#94a3b8" stroke-width="2"/><text x="${k*44+22}" y="33" text-anchor="middle" font-size="18" font-weight="bold" fill="${mark.includes(k)?'#ffffff':'#1e293b'}">${v}</text>`).join('');
 return `<svg viewBox="0 0 ${w} 52" class="st" role="img"><rect width="${w}" height="52" rx="10" fill="#f8fafc"/>${cells}</svg>`;
}
const numPanel=(vals,col,cap)=>`<div style="background:#fff;border:4px solid #cbd5e1;border-radius:14px;padding:10px;text-align:center"><div style="font-size:21px;font-weight:bold;color:${col};line-height:1.9">${vals.join('، ')}</div>${cap?`<div style="font-size:15px;color:#475569">${cap}</div>`:''}</div>`;
const numBox=n=>`<div style="background:#fff;border:4px solid #cbd5e1;border-radius:14px;padding:18px 0;text-align:center;font-size:30px;font-weight:bold;color:#1e293b">${n}</div>`;
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الرياضيات. هيا نكتشف المضاعفات معاً!');
 return `<div class="card c"><h1>المضاعفات</h1><p>سنعدّ ونكتشف كيف نجد مضاعفات الأعداد والمضاعف المشترك الأصغر.</p><div class="row"><figure>${numStrip([6,12,18,24,30],[0,1,2,3,4],'#2563eb')}<figcaption>مضاعفات 6</figcaption></figure><figure>${numStrip([8,16,24,32,40],[0,1,2,3,4],'#f97316')}<figcaption>مضاعفات 8</figcaption></figure></div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الحافلتين. متى تلتقيان من جديد؟');
 const o=[['الحافلة الأولى تمر بعد 6 دقائق ثم بعد 12 دقيقة ثم بعد 18 دقيقة',1],['الحافلة الثانية تمر بعد 8 دقائق ثم بعد 16 دقيقة ثم بعد 24 دقيقة',1],['تلتقي الحافلتان بعد 14 دقيقة',0],['تلتقي الحافلتان بعد 48 دقيقة فقط',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>حافلتان انطلقتا معاً: الأولى تمر كل 6 دقائق، والثانية كل 8 دقائق. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${numStrip([6,12,18,24,30],[0,1,2,3,4],'#2563eb')}<figcaption>الحافلة الأولى: كل 6 دقائق</figcaption></figure><figure>${numStrip([8,16,24,32,40],[0,1,2,3,4],'#f97316')}<figcaption>الحافلة الثانية: كل 8 دقائق</figcaption></figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.a=s.a??6;s.b=s.b??8;s.cm=s.cm||[];say('حرّك المنزلقين لاختيار عددين، ثم اضغط على عدد أخضر.');
 return `<div class="card"><h2>نستكشف</h2><p>اختر عددين بالمنزلقين، ولاحظ مضاعفاتهما في الجدول، ثم اضغط على عدد أخضر.</p><div class="row"><div><b>العدد الأول: <span id="la">${s.a}</span></b><input id="ra" type="range" min="2" max="9" value="${s.a}" dir="ltr" aria-label="العدد الأول"></div><div><b>العدد الثاني: <span id="lb">${s.b}</span></b><input id="rb" type="range" min="2" max="9" value="${s.b}" dir="ltr" aria-label="العدد الثاني"></div></div><div id="grid"></div><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر كيف نجد المضاعف المشترك الأصغر.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${numStrip([6,12,18,24,30],[0,1,2,3,4],'#2563eb')}<p><b class="b">مضاعف</b>: نتائج ضرب العدد في 1 و2 و3... مضاعفات 6 هي: 6، 12، 18، 24، 30...</p></div><div>${numStrip([4,8,12,16,20],[0,1,2,3,4],'#f97316')}<p><b class="o">مضاعف مشترك</b>: عدد هو مضاعف لعددين في نفس الوقت. 12 مضاعف لـ 4 و6.</p></div><div>${numStrip([6,12,18,24],[0,1,2,3],'#16a34a')}<p><b style="color:var(--g)">المضاعف المشترك الأصغر</b>: أول عدد مشترك بين العددين. أصغر مضاعف مشترك لـ 6 و8 هو 24.</p></div></div><h3>أين نجده في حياتنا؟</h3><div class="exp"><div><p>🚌</p><p>مواعيد الحافلات: تلتقي الحافلتان بعد 24 دقيقة.</p></div><div><p>⏰</p><p>جرسا مدرسة يرنان معاً كل 6 دقائق وكل 8 دقائق.</p></div><div><p>🍬</p><p>توزيع الحلوى في علب متساوية بلا باقٍ.</p></div></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${r.mini}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.ch.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: المضاعف المشترك الأصغر هو أول عدد مشترك بين العددين.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل المضاعفات.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">مضاعفات العدد هي نتائج ضربه في 1 و2 و3...، والمضاعف المشترك الأصغر هو أول عدد مشترك بين عددين.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{a:'مضاعف',pre:'العدد 18 هو',post:'للعدد 6.',ch:['مضاعف','قاسم'],mini:numStrip([6,12,18],[2],'#2563eb'),h:'18 = 6 × 3، إذن 18 من مضاعفات 6.'},
 {a:'12',pre:'أصغر مضاعف مشترك لـ 4 و6 هو',post:'.',ch:['12','24'],mini:numStrip([4,8,12],[2],'#f97316'),h:'مضاعفات 4 هي 4 و8 و12...، ومضاعفات 6 هي 6 و12...، وأول عدد مشترك هو 12.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها مضاعفات العدد 6.',o:[numPanel([6,12,18,24],'#2563eb'),numPanel([6,11,16,21],'#f97316'),numPanel([5,10,15,20],'#16a34a')],a:0,why:'الأعداد 6 و12 و18 و24 كلها نتائج ضرب 6 في 1 و2 و3 و4.',h:'مضاعفات 6 تزيد بـ 6 في كل مرة.'},
 {t:'ch',q:'أي عدد من هذه الأعداد مضاعف لـ 7 و3 في نفس الوقت؟',o:['21','14','10','12'],a:0,why:'21 = 7 × 3، فهو مضاعف لـ 7 و3 معا.',h:'ابحث عن عدد يقبل القسمة على 7 وعلى 3 معا.'},
 {t:'ch',q:'ما أكبر مضاعف لـ 8 أصغر من 40؟',o:['32','40','24','48'],a:0,why:'مضاعفات 8 هي 8 و16 و24 و32 و40...، وأكبرها الأصغر من 40 هو 32.',h:'مضاعفات 8 هي 8 و16 و24 و32 و40...'},
 {t:'mt',q:'اضغط على عدد، ثم على الوصف المناسب له.',it:[numBox('8'),numBox('18'),numBox('12')],W:['مضاعف لـ 4','مضاعف لـ 6','مضاعف لـ 4 و6'],ws:[2,0,1],why:'8 مضاعف لـ 4، و18 مضاعف لـ 6، و12 مضاعف لـ 4 و6 في نفس الوقت.',h:'هل يقبل العدد القسمة على 4؟ وعلى 6؟'},
 {t:'sl',q:'حرّك المنزلق لاختيار أصغر مضاعف مشترك لـ 6 و8، ثم اضغط «تحقق».',min:6,max:48,step:1,def:12,target:24,fmt:v=>v+' دقيقة',why:'مضاعفات 6 هي 6 و12 و18 و24...، ومضاعفات 8 هي 8 و16 و24...، وأول عدد مشترك هو 24.',h:'اكتب مضاعفات 6 ومضاعفات 8 حتى تجد أول عدد مشترك.'},
 {t:'ch',q:'مضاعفات 5 هي:',o:['5 و10 و15 و20','5 و7 و9 و11','5 و6 و7 و8','1 و2 و3 و4'],a:0,why:'مضاعفات 5 هي نتائج ضرب 5 في 1 و2 و3 و4...',h:'اضرب 5 في 1 و2 و3 و4.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الحافلتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل تلتقي الحافلتان فعلاً بعد هذه المدة؟',false)}}

/* 2: الاستكشاف */
function multDraw(){const s=S[2],{a,b}=s;
 const mults=n=>{const r=[];for(let k=n;k<=48;k+=n)r.push(k);return r};
 const ma=mults(a),mb=mults(b),mc=ma.filter(x=>mb.includes(x));
 let cells='';
 for(let n=1;n<=48;n++){
  const x=(n-1)%8,y=Math.floor((n-1)/8);
  const isA=n%a==0,isB=n%b==0;
  const fill=isA&&isB?'#16a34a':isA?'#2563eb':isB?'#f97316':'#ffffff';
  const stroke=s.cm.includes(n)?'#ca8a04':'#94a3b8';
  cells+=`<g onclick="mCell(${n})" style="cursor:pointer"><rect x="${x*44+2}" y="${y*36+2}" width="40" height="32" rx="7" fill="${fill}" stroke="${stroke}" stroke-width="${s.cm.includes(n)?4:2}"/><text x="${x*44+22}" y="${y*36+24}" text-anchor="middle" font-size="16" font-weight="bold" fill="${isA||isB?'#ffffff':'#1e293b'}">${n}</text></g>`;
 }
 $('#grid').innerHTML=`<svg viewBox="0 0 356 220" class="board"><rect width="356" height="220" fill="#f8fafc"/>${cells}</svg>`;
 $('#msg').textContent=`مضاعفات ${a}: ${ma.slice(0,6).join('، ')}... — مضاعفات ${b}: ${mb.slice(0,6).join('، ')}... — المضاعفات المشتركة: ${mc.slice(0,4).join('، ')}`;
 $('#chips').innerHTML=[['مضاعفات العدد الأول',!!s.tA],['مضاعفات العدد الثاني',!!s.tB],['مضاعف مشترك',s.cm.length>0]].map(([t,on])=>`<span class="chip${on?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.tA&&s.tB&&s.cm.length>0){s.done=1;nav();say('أحسنت! اكتشفت المضاعفات والمضاعفات المشتركة. هيا نفسّرها.')}}
function mCell(n){const s=S[2];
 if(n%s.a==0&&n%s.b==0){if(!s.cm.includes(n))s.cm.push(n);say('أحسنت! '+n+' مضاعف مشترك لـ '+s.a+' و'+s.b+'.')}
 else if(n%s.a==0||n%s.b==0)say(n+' مضاعف لأحد العددين فقط، ابحث عن عدد أخضر.',false);
 else say(n+' ليس مضاعفا لأي من العددين.',false);
 multDraw()}
hooks[2]=()=>{const s=S[2],ra=$('#ra'),rb=$('#rb');multDraw();
 ra.oninput=()=>{s.a=+ra.value;s.tA=1;s.cm=[];$('#la').textContent=s.a;multDraw()};
 rb.oninput=()=>{s.b=+rb.value;s.tB=1;s.cm=[];$('#lb').textContent=s.b;multDraw()}};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${o}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`${q.p?`<div class="row">${q.p}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${o}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='sl'){s.a=s.a??q.def;b=`<div class="c"><div id="sld" class="score" style="font-size:38px">${q.fmt(s.a)}</div><input id="sr" type="range" min="${q.min}" max="${q.max}" step="${q.step}" value="${s.a}" dir="ltr" aria-label="اختر العدد"><div class="row"><button onclick="slchk()" ${s.d?'disabled':''}>تحقق</button></div></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الوصف المناسب لهذا العدد.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على عدد.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليست هذه الكلمة. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],q=Q[4],rg=$('#sr');if(!rg)return;
 const upd=()=>{$('#sld').textContent=q.fmt(+rg.value)};
 upd();
 rg.oninput=()=>{if(s.d)return;s.a=+rg.value;upd()};
 if(s.d)rg.disabled=true};
function slchk(){const s=st(),q=Q[i-5];if(s.d)return;
 if(Math.abs(s.a-q.target)<0.001)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
