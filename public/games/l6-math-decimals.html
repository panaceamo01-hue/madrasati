<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأعداد العشرية: الجمع والطرح والضرب – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="24" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function colSVG(kind){
 const ok=kind=='ok',bad1=kind=='bad1';
 const x2=ok?95:(bad1?78:95), t2=ok?'3,50':(bad1?'3,50':'3,5');
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="95" y="32" text-anchor="end" font-size="22" font-weight="bold" fill="#1e293b">12,75</text><text x="${x2}" y="60" text-anchor="end" font-size="22" font-weight="bold" fill="#f97316">+ ${t2}</text>${L(15,70,105,70,'#94a3b8',2)}</svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='col-ok'||t=='col-bad1'||t=='col-bad2')return colSVG(t=='col-ok'?'ok':(t=='col-bad1'?'bad1':'bad2'));
 if(t=='op-add')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">3,5 + 2,25</text>`;
 if(t=='op-sub')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">7,8 − 2,3</text>`;
 if(t=='op-mul')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">1,5 × 6</text>`;
 if(t=='rule-add')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">12,75</text><text x="60" y="72" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">+ 3,50</text>`;
 if(t=='rule-mul')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="45" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">2,5 × 4</text><text x="60" y="72" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">= 10</text>`;
 return s+'</g></svg>';
}
function shopSVG(){
 return `<svg viewBox="0 0 320 200" class="st" role="img"><rect width="320" height="200" rx="14" fill="#fef3c7"/><rect x="40" y="60" width="100" height="70" rx="8" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="90" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400e">12,75</text><rect x="180" y="60" width="100" height="70" rx="8" fill="#fff" stroke="#d97706" stroke-width="3"/><text x="230" y="105" text-anchor="middle" font-size="20" font-weight="bold" fill="#92400e">3,5</text><text x="160" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#475569">كتاب وعصير</text></svg>`;
}
function walletSVG(){
 return `<svg viewBox="0 0 320 200" class="st" role="img"><rect width="320" height="200" rx="14" fill="#dbeafe"/><rect x="60" y="70" width="200" height="90" rx="12" fill="#2563eb"/><rect x="200" y="95" width="60" height="40" rx="8" fill="#1e40af"/><circle cx="230" cy="115" r="10" fill="#facc15"/><text x="160" y="50" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">20 درهما</text></svg>`;
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الأعداد العشرية. هيا نتعلم الجمع والطرح والضرب معاً!');
 return `<div class="card c"><h1>الأعداد العشرية: الجمع والطرح والضرب</h1><p>سنلاحظ ونجرّب ونكتشف كيف نجمع الأعداد العشرية ونطرحها ونضربها.</p><div class="row">${tile('3,5','3 وحدات و5 أعشار')}${tile('12,75 + 3,50','= 16,25')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['مجموع المشتريات 16,25 درهما',1],['مجموع المشتريات 15,25 درهما',0],['يبقى مع سلمى 3,75 دراهم',1],['يبقى مع سلمى 4,25 دراهم',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>سلمى معها 20 درهما. اشترت كتابا بـ 12,75 درهما وعصيرا بـ 3,5 دراهم. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${shopSVG()}المشتريات</figure><figure>${walletSVG()}ما مع سلمى</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.a=s.a??4;s.b=s.b??0;s.g=s.g||{};say('غيّر المنزلقين: الأول للأعشار والثاني للأجزاء من مئة. ماذا يحدث؟');
 return `<div class="card"><h2>نستكشف</h2><p>أضف عددا عشريا إلى 3,57 واكتشف 3 حالات مختلفة للجمع.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p style="text-align:center;font-weight:bold">الأعشار: <span id="av"></span></p><input id="rg" type="range" min="0" max="9" value="${s.a}" dir="ltr" aria-label="الأعشار"><p style="text-align:center;font-weight:bold">الأجزاء من مئة: <span id="bv"></span></p><input id="rg2" type="range" min="0" max="9" value="${s.b}" dir="ltr" aria-label="الأجزاء من مئة"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل الأعداد العشرية حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${tile('3,5','الفاصلة تفصل الجزء الصحيح عن الجزء العشري')}<p><b class="b">الفاصلة والقيمة المكانية</b>: في 3,5 الرقم 3 هو الوحدات والرقم 5 هو الأعشار.</p></div><div>${colSVG('ok')}<p><b class="o">الجمع والطرح</b>: نضع الفواصل فوق بعضها، ونكمل بالأصفار عند الحاجة.</p></div><div>${tile('2,5 × 4','= 10')}<p><b class="r">الضرب</b>: نضرب كأن الفاصلة غير موجودة، ثم نضع الفاصلة في الناتج.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${tile('3,5 دراهم','ثمن قطعة حلوى')}<figcaption>أثمان المشتريات</figcaption></figure><figure>${tile('12,75 سم','طول قلم')}<figcaption>قياس الأطوال</figcaption></figure><figure>${tile('2,5 كغ','كتلة التفاح')}<figcaption>قياس الكتل</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>عند ${r.a} ${r.post}</p></div>`:`<div class="rule"><p>عند <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: اكتب 3,5 على شكل 3,50 لتتساوى الخانات.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الأعداد العشرية.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">عند الجمع والطرح ضع الفواصل فوق بعضها، وعند الضرب اضرب ثم ضع الفاصلة.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{a:'جمع عددين عشريين أو طرحهما نضع الفاصلتين',t:'rule-add',k:-12,post:'فوق بعضهما، ونكمل بالأصفار عند الحاجة.',h:'في الجمع والطرح نرتب الخانات، والفاصلة هي التي ترتبها.',o:['جمع عددين عشريين أو طرحهما نضع الفاصلتين','ضرب عدد عشري نضرب كأن الفاصلة غير موجودة']},
 {a:'ضرب عدد عشري نضرب كأن الفاصلة غير موجودة',t:'rule-mul',k:14,post:'ثم نضع الفاصلة في الناتج بعدد الأرقام العشرية.',h:'في الضرب لا نضع الفواصل فوق بعضها، بل نضرب أولا ثم نضع الفاصلة.',o:['جمع عددين عشريين أو طرحهما نضع الفاصلتين','ضرب عدد عشري نضرب كأن الفاصلة غير موجودة']}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها الفاصلتان فوق بعضهما.',o:[['col-bad1',25],['col-ok',-18],['col-bad2',8]],a:1,why:'الفاصلتان فوق بعضهما، فالخانات مرتبة: الوحدات فوق الوحدات والأعشار فوق الأعشار.',h:'ابحث عن الصورة التي تتطابق فيها الفواصل عموديا.'},
 {t:'ch',q:'ما ناتج 3,5 + 2,25؟',o:['5,75','5,25','6,75'],a:0,why:'3,50 + 2,25 = 5,75.',h:'اكتب 3,5 على شكل 3,50 ثم اجمع.'},
 {t:'ch',q:'ما ناتج 7,8 − 2,3؟',o:['5,5','5,3','6,5'],a:0,why:'7,8 − 2,3 = 5,5.',h:'اطرح الأعشار من الأعشار والوحدات من الوحدات.'},
 {t:'mt',q:'اضغط على صورة، ثم على الناتج المناسب لها.',it:[['op-add',20],['op-sub',-25],['op-mul',10]],W:['5,75','5,5','9'],ws:[2,0,1],why:'3,5 + 2,25 = 5,75، و7,8 − 2,3 = 5,5، و1,5 × 6 = 9.',h:'احسب كل عملية أولا.'},
 {t:'rt',T:35,min:0,max:50,q:'حرّك المنزلق ليصبح الناتج 16,25: 12,75 + ؟',why:'12,75 + 3,50 = 16,25.',h:'المطلوب هو 16,25 − 12,75 = 3,50.'},
 {t:'ch',q:'ما ناتج 4,25 × 8؟',o:['34','3,4','340'],a:0,why:'425 × 8 = 3400، وفي الناتج رقمان عشريان، إذن 34.',h:'425 × 8 = 3400، ثم ضع الفاصلة بعد رقمين.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل جمعت الأعداد كما يجب؟',false)}}

/* 2: الاستكشاف */
function fmtH(h){const ip=Math.floor(h/100),fp=h%100;return ip+','+String(fp).padStart(2,'0')}
function exDraw(){const s=S[2],a=s.a,b=s.b,add=a*10+b,tot=357+add;
 const carryH=(7+b)>=10,carryT=(5+a+(carryH?1:0))>=10;
 let k=null,m;
 const sum=fmtH(tot),ad='0,'+a+b;
