<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>العلاقات بين زوايا الأشكال – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function triAng(a1,a2,a3){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M20 82 L100 82 L62 26 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><text x="26" y="72" font-size="12" font-weight="bold" fill="#1e293b">${a1}°</text><text x="84" y="72" font-size="12" font-weight="bold" fill="#1e293b">${a2}°</text><text x="56" y="44" font-size="12" font-weight="bold" fill="#1e293b">${a3}°</text></svg>`;
}
function triMarked(a,b){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M20 82 L100 82 L62 26 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><path d="M20 82h12v-12H20z" fill="#fde047" stroke="#16a34a" stroke-width="1.5"/><text x="38" y="72" font-size="12" font-weight="bold" fill="#1e293b">${a}°</text><text x="84" y="72" font-size="12" font-weight="bold" fill="#1e293b">${b}°</text><text x="58" y="44" font-size="12" font-weight="bold" fill="#dc2626">؟</text></svg>`;
}
function paraPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M35 78 L95 78 L80 26 L20 26 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/><text x="30" y="66" font-size="12" font-weight="bold" fill="#1e293b">110°</text><text x="78" y="66" font-size="12" font-weight="bold" fill="#1e293b">70°</text></svg>`;
}
function paraMarked(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M35 78 L95 78 L80 26 L20 26 Z" fill="#fef3c7" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/><text x="30" y="66" font-size="12" font-weight="bold" fill="#1e293b">110°</text><text x="80" y="66" font-size="12" font-weight="bold" fill="#dc2626">؟</text></svg>`;
}
function squarePic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="20" width="60" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><path d="M30 20h10v10H30z M80 20h10v10H80z M30 70h10v10H30z M80 70h10v10H80z" fill="#fde047" stroke="#16a34a" stroke-width="1.5"/></svg>`;
}
function roofPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M15 62 L60 20 L105 62 Z" fill="#fecaca" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/><rect x="30" y="62" width="60" height="26" fill="#fef3c7" stroke="#d97706" stroke-width="3"/></svg>`;
}
function doorPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><path d="M38 82 L96 82 L82 22 L24 22 Z" fill="#e0f2fe" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>${L(60,82,52,22,'#2563eb',2)}</svg>`;
}
function windowPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="18" width="60" height="64" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>${L(60,18,60,82,'#2563eb',3)}${L(30,50,90,50,'#2563eb',3)}</svg>`;
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نكتشف زوايا الأشكال معاً!');
 return `<div class="card c"><h1>العلاقات بين زوايا الأشكال</h1><p>سنلاحظ ونجرّب ونكتشف كيف ترتبط زوايا المثلث وزوايا الشكل الرباعي.</p><div class="row">${triAng(60,70,50)}${squarePic()}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الزاوية الثالثة 50° لأن 60 + 70 + 50 = 180',1],['في الصورة 1: مجموع الزوايا 360°',0],['في الصورة 2: الزوايا 100° و100° و100°، ومجموعها 300°',1],['في الصورة 2: يمكن أن يكون هذا مثلثا',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>أراد يوسف رسم مثلث زاويتاه 60° و70°. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${triAng(60,70,50)}الصورة 1</figure><figure>${triAng(100,100,100)}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.cx=s.cx??180;s.cy=s.cy??70;s.g=s.g||{};say('اسحب النقطة الخضراء ج، ولاحظ كيف تتغير الزوايا.');
 return `<div class="card"><h2>نستكشف</h2><p>اسحب النقطة الخضراء ج في كل الاتجاهات، واكتشف 3 أنواع من المثلثات. لاحظ أن مجموع الزوايا يبقى دائما 180°.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد هذه الزوايا حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${triAng(60,70,50)}<p><b class="b">زوايا المثلث</b>: مجموعها 180° دائما. إذا عرفنا زاويتين، نجد الثالثة بطرح مجموعهما من 180°.</p></div><div>${paraPic()}<p><b class="o">متوازي الأضلاع</b>: كل زاويتين متقابلتين متساويتان، وكل زاويتين متتابعتين مجموعهما 180°.</p></div><div>${squarePic()}<p><b class="r">الشكل الرباعي</b>: مجموع زواياه 360°، لأنه ينقسم إلى مثلثين.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${roofPic()}<figcaption>سقف مثلث</figcaption></figure><figure>${doorPic()}<figcaption>باب منزلق</figcaption></figure><figure>${windowPic()}<figcaption>نافذة مربعة</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${r.pic}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: المثلث 180°، والشكل الرباعي مثلثان، أي 360°.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل زوايا الأشكال.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">مجموع زوايا المثلث 180°، ومجموع زوايا الشكل الرباعي 360°.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[
 {pre:'مجموع زوايا المثلث يساوي',a:'180°',opts:['180°','360°'],post:'دائما.',pic:triAng(60,70,50),h:'اجمع زوايا أي مثلث: الناتج 180° دائما.'},
 {pre:'مجموع زوايا الشكل الرباعي يساوي',a:'360°',opts:['180°','360°'],post:'لأنه ينقسم إلى مثلثين.',pic:squarePic(),h:'الشكل الرباعي مثلثان، وكل مثلث 180°، فيكون المجموع 360°.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها مثلث مجموع زواياه 180°.',o:[triAng(100,100,100),triAng(60,70,50),triAng(90,60,60)],a:1,why:'60 + 70 + 50 = 180، وهذا مجموع زوايا أي مثلث.',h:'اجمع الزوايا الثلاث: يجب أن يساوي المجموع 180°.'},
 {t:'ch',q:'مثلث زاويتاه 90° و45°، ما قياس الزاوية الثالثة؟',p:triMarked(90,45),o:['90°','45°','135°','180°'],a:1,why:'180 - (90 + 45) = 45°.',h:'اطرح مجموع الزاويتين المعلومتين من 180°.'},
 {t:'ch',q:'في متوازي الأضلاع، زاويتان متقابلتان:',p:paraPic(),o:['متساويتان','مجموعهما 90°','مختلفتان دائما','إحداهما ضعف الأخرى'],a:0,why:'في متوازي الأضلاع، الزاويتان المتقابلتان متساويتان دائما.',h:'انظر إلى الزاويتين المتقابلتين في الصورة.'},
 {t:'mt',q:'اضغط على صورة، ثم على الاسم المناسب لها.',it:[triAng(60,70,50),paraPic(),squarePic()],W:['مجموع زواياه 180°','زواياه المتقابلة متساوية','مجموع زواياه 360°'],ws:[1,2,0],why:'المثلث مجموع زواياه 180°، ومتوازي الأضلاع زواياه المتقابلة متساوية، والمربع مجموع زواياه 360°.',h:'كم مجموع زوايا كل شكل؟'},
 {t:'rt',T:110,q:'حرّك المنزلق حتى تصبح الزاوية 110°، ثم اضغط «تحقق».',why:'الزاوية 110° منفرجة: أكبر من 90° وأصغر من 180°.',h:'الزاوية المنفرجة أكبر من الزاوية القائمة.'},
 {t:'ch',q:'في متوازي الأضلاع، إحدى الزوايا 110°، ما قياس الزاوية المجاورة لها؟',p:paraMarked(),o:['110°','90°','70°','55°'],a:2,why:'الزاويتان المتتابعتان مجموعهما 180°: 180 - 110 = 70°.',h:'الزاويتان المتجاورتان مجموعهما 180°.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل يمكن أن يكون مجموع زوايا المثلث 300°؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],A={x:70,y:190},B={x:290,y:190},C={x:s.cx,y:s.cy};
 const angAt=(p,q,r)=>{const v1={x:p.x-q.x,y:p.y-q.y},v2={x:r.x-q.x,y:r.y-q.y};return Math.abs(Math.atan2(v1.x*v2.y-v1.y*v2.x,v1.x*v2.x+v1.y*v2.y))*180/Math.PI};
 const aA=angAt(B,A,C),aB=angAt(A,B,C),aC=180-aA-aB,r0=x=>Math.round(x);
 const isRight=v=>v>=87&&v<=93,isObt=v=>v>93,isEqui=v=>v>=56&&v<=64;
 if([aA,aB,aC].some(isRight))s.g.r=1;
 if([aA,aB,aC].some(isObt))s.g.o=1;
 if([aA,aB,aC].every(isEqui))s.g.e=1;
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
