<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>النقود في وضعيات الحياة اليومية – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function coinsSVG(vals){
 let c='';
 vals.forEach((v,k)=>{
  const x=30+k*30;
  c+=`<circle cx="${x}" cy="50" r="17" fill="#facc15" stroke="#ca8a04" stroke-width="2"/><text x="${x}" y="56" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">${v}</text>`;
 });
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${c}</svg>`;
}
function shopSVG(){
 return `<svg viewBox="0 0 320 200" class="st" role="img"><rect width="320" height="200" rx="14" fill="#fef3c7"/><rect x="50" y="55" width="90" height="110" rx="6" fill="#2563eb"/><rect x="62" y="70" width="66" height="80" rx="4" fill="#fff"/><text x="95" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">25 درهما</text><rect x="180" y="75" width="90" height="20" rx="8" fill="#dc2626"/><text x="225" y="145" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">7 دراهم</text></svg>`;
}
function noteSVG(){
 return `<svg viewBox="0 0 320 200" class="st" role="img"><rect width="320" height="200" rx="14" fill="#dbeafe"/><rect x="40" y="60" width="240" height="90" rx="8" fill="#16a34a"/><circle cx="160" cy="105" r="28" fill="#dcfce7"/><text x="160" y="115" text-anchor="middle" font-size="26" font-weight="bold" fill="#14532d">50</text><text x="160" y="180" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">ورقة 50 درهما</text></svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='coins-30')return coinsSVG([10,10,10]);
 if(t=='coins-25')return coinsSVG([10,10,5]);
 if(t=='coins-15')return coinsSVG([5,5,5]);
 if(t=='mt-50')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">دفعت 50 درهما</text><text x="60" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">الثمن 32 درهما</text>`;
 if(t=='mt-20')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">دفعت 20 درهما</text><text x="60" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">الثمن 14 درهما</text>`;
 if(t=='mt-100')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="42" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">دفعت 100 درهم</text><text x="60" y="68" text-anchor="middle" font-size="16" font-weight="bold" fill="#2563eb">الثمن 65 درهما</text>`;
 if(t=='rule-change')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="48" text-anchor="middle" font-size="18" font-weight="bold" fill="#92400e">50 − 32 = 18</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#92400e">الباقي 18 درهما</text>`;
 if(t=='rule-cent')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">1 درهم = 100 سنتيم</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#92400e">نصف درهم = 50 سنتيم</text>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة النقود. هيا نتعلم حساب المشتريات والباقي معاً!');
 return `<div class="card c"><h1>النقود في وضعيات الحياة اليومية</h1><p>سنلاحظ ونجرّب ونكتشف كيف نحسب مجموع المشتريات والباقي وندبر مصروفنا.</p><div class="row">${tile('50 − 32','= 18 درهما')}${tile('20 × 5','= 100 درهم')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['مجموع المشتريات 32 درهما',1],['مجموع المشتريات 30 درهما',0],['الباقي 18 درهما',1],['الباقي 20 درهما',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>اشتريت كتابا بـ 25 درهما وقلما بـ 7 دراهم، ودفعت ورقة 50 درهما. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${shopSVG()}كتاب وقلم</figure><figure>${noteSVG()}ورقة 50 درهما</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.p=s.p??30;s.mi=s.mi??1;s.g=s.g||{};say('غيّر المنزلقين: الأول لثمن المشتريات والثاني للمبلغ المدفوع. ماذا يحدث؟');
 return `<div class="card"><h2>نستكشف</h2><p>هذه آلة الصرف: جرّب ثمنا ومبلغا مختلفين واكتشف 3 حالات.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p style="text-align:center;font-weight:bold">ثمن المشتريات: <span id="pv"></span> درهما</p><input id="rg" type="range" min="0" max="100" step="5" value="${s.p}" dir="ltr" aria-label="ثمن المشتريات"><p style="text-align:center;font-weight:bold">المبلغ المدفوع: <span id="mv"></span> درهما</p><input id="rg2" type="range" min="0" max="3" value="${s.mi}" dir="ltr" aria-label="المبلغ المدفوع"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل النقود حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${tile('200 · 100 · 50 · 20','أوراق الدرهم')}<p><b class="b">الأوراق والقطع المغربية</b>: الأوراق 200 و100 و50 و20 درهما، والقطع 20 و10 و5 و2 و1 درهم ونصف درهم. والدرهم يساوي 100 سنتيم.</p></div><div>${tile('50 − 32','= 18 درهما')}<p><b class="o">المجموع والباقي</b>: الباقي = المبلغ المدفوع − ثمن المشتريات. نجمع الأثمان أولا ثم نطرح.</p></div><div>${tile('20 × 5','= 100 درهم')}<p><b class="r">أدبر مصروفي</b>: نخطط قبل الشراء ونوفر جزءا من المال. إذا وفرت 20 درهما كل أسبوع، فبعد 5 أسابيع توفر 100 درهم.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${coinsSVG([10,10,10])}<figcaption>الدفع في الدكان</figcaption></figure><figure>${tile('100 − 65','= 35 درهما')}<figcaption>حساب الباقي عند البائع</figcaption></figure><figure>${tile('15 × 6','= 90 درهما')}<figcaption>توفير المصروف كل أسبوع</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: الباقي = المبلغ المدفوع − ثمن المشتريات.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل النقود.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">اجمع الأثمان أولا، ثم اطرح من المبلغ المدفوع، ووفر جزءا من مصروفك.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'الباقي =',a:'المبلغ المدفوع',post:'− ثمن المشتريات.',t:'rule-change',k:-12,h:'الباقي هو ما يرجعه البائع، أي المبلغ المدفوع ناقص ثمن المشتريات.',o:['المبلغ المدفوع','ثمن المشتريات']},
 {pre:'الدرهم الواحد يساوي',a:'100',post:'سنتيم.',t:'rule-cent',k:14,h:'في الدرهم الواحد 100 سنتيم، وفي نصف الدرهم 50 سنتيم.',o:['100','10']}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها 30 درهما.',o:[['coins-25',25],['coins-30',-18],['coins-15',8]],a:1,why:'ثلاث قطع من فئة 10 دراهم تساوي 30 درهما.',h:'اجمع قيم القطع في كل صورة.'},
 {t:'ch',q:'دفعت 20 درهما مقابل شيء ثمنه 14 درهما. ما الباقي؟',o:['6 دراهم','4 دراهم','8 دراهم'],a:0,why:'20 − 14 = 6 دراهم.',h:'اطرح 14 من 20.'},
 {t:'ch',q:'اشتريت كتابا بـ 25 درهما وقلما بـ 7 دراهم. ما مجموع ما دفعت؟',o:['32 درهما','30 درهما','35 درهما'],a:0,why:'25 + 7 = 32 درهما.',h:'اجمع 25 + 7.'},
 {t:'mt',q:'اضغط على صورة، ثم على الباقي المناسب لها.',it:[['mt-50',20],['mt-20',-25],['mt-100',10]],W:['18 درهما','6 دراهم','35 درهما'],ws:[2,0,1],why:'50 − 32 = 18 درهما، و20 − 14 = 6 دراهم، و100 − 65 = 35 درهما.',h:'اطرح الثمن من المبلغ المدفوع.'},
 {t:'rt',T:15,min:0,max:20,q:'حرّك المنزلق حتى توفر سلمى 90 درهما بعد 6 أسابيع.',why:'6 × 15 = 90 درهما.',h:'اقسم 90 على 6.'},
 {t:'ch',q:'توفر سلمى 15 درهما كل أسبوع. كم توفر بعد 6 أسابيع؟',o:['90 درهما','75 درهما','60 درهما'],a:0,why:'15 × 6 = 90 درهما.',h:'اضرب 15 في 6.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: اجمع الثمنين أولا.',false)}}

/* 2: الاستكشاف */
const PAID=[20,50,100,200];
function exDraw(){const s=S[2],p=s.p,paid=PAID[s.mi],ch=paid-p;
 let k=null,m;
 if(ch>0){k='enough';m='المبلغ يكفي: دفعت '+paid+' درهما والثمن '+p+' درهما، والباقي '+ch+' درهما.'}
 else if(ch==0){k='zero';m='الباقي صفر: دفعت '+paid+' درهما والثمن '+p+' درهما تماما.'}
 else{k='short';m='المبلغ لا يكفي: دفعت '+paid+' درهما والثمن '+p+' درهما، وينقصك '+(p-paid)+' درهما.'}
 if(k&&s.t)s.g[k]=1;

 $('#pv').textContent=p;$('#mv').textContent=paid;

 $('#chips').innerHTML=[['enough','المبلغ يكفي'],['zero','الباقي صفر'],['short','المبلغ لا يكفي']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.enough&&s.g.zero&&s.g.short){s.done=1;nav();say('أحسنت! اكتشفت الحالات الثلاث. هيا نفسّرها.')}}
hooks[2]=()=>{const s=S[2],rg=$('#rg'),rg2=$('#rg2');exDraw();

 rg2.oninput=()=>{s.mi=+rg2.value;s.t=1;exDraw()}};

function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pair(o[0],o[1])}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`<div class="row">${q.p||''}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pair(o[0],o[1])}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??10;b=`<svg id="rs" viewBox="0 0 360 220" class="board"></svg><input id="rr" type="range" min="${q.min}" max="${q.max}" value="${s.a}" dir="ltr" aria-label="التوفير الأسبوعي"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الباقي المناسب لهذه الوضعية.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليست هذه الكلمة. تلميح: '+q.h}}
 render()}

 d();rg.oninput=()=>{if(s.d)return;let a=+rg.value;if(Math.abs(a-q.T)<=1)a=q.T;s.a=a;rg.value=a;d()}};
