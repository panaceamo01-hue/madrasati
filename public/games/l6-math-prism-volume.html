<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجم الموشور القائم – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
.sl{font-size:15px;font-weight:bold;color:#475569;text-align:center;margin:2px 0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function box(kind){
 const f=kind=='base'?'#e2e8f0':'#2563eb',sd=kind=='base'?'#cbd5e1':'#1d4ed8',tp=(kind=='tot'||kind=='base')?'#f97316':'#e2e8f0';
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="25,35 40,20 95,20 80,35" fill="${tp}" stroke="#94a3b8" stroke-width="2"/><polygon points="80,35 95,20 95,65 80,80" fill="${sd}" stroke="#94a3b8" stroke-width="2"/><rect x="25" y="35" width="55" height="45" fill="${f}" stroke="#94a3b8" stroke-width="2"/></svg>`;
}
function prismTri(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="30,80 60,25 78,11 48,66" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><polygon points="60,25 90,80 108,66 78,11" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/><polygon points="30,80 60,25 90,80" fill="#2563eb" stroke="#1e40af" stroke-width="2"/></svg>`;
}
function cylPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="35" y="25" width="50" height="55" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="25" rx="25" ry="8" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="80" rx="25" ry="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/></svg>`;
}
function pyrPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="60,15 25,80 95,80" fill="#f97316" stroke="#92400e" stroke-width="2"/><polygon points="25,80 95,80 82,88 38,88" fill="#fdba74" stroke="#92400e" stroke-width="2"/></svg>`;
}
function layersPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="25,35 40,20 95,20 80,35" fill="#f97316" stroke="#94a3b8" stroke-width="2"/><polygon points="80,35 95,20 95,65 80,80" fill="#1d4ed8" stroke="#94a3b8" stroke-width="2"/><rect x="25" y="35" width="55" height="45" fill="#2563eb" stroke="#94a3b8" stroke-width="2"/>${[47,59,71].map(y=>L(25,y,80,y,'#fff',2)).join('')}</svg>`;
}
function triArea(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="20,80 60,25 100,80" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>${L(60,25,60,80,'#dc2626',2,'stroke-dasharray="5 4"')}<text x="60" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">القاعدة × الارتفاع ÷ 2</text></svg>`;
}
function volPic(txt,tri){
 const shape=tri?`<polygon points="30,75 55,30 80,75" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><polygon points="55,30 80,75 95,62 70,17" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>`:`<rect x="30" y="30" width="50" height="45" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><polygon points="30,30 42,18 92,18 80,30" fill="#f97316" stroke="#94a3b8" stroke-width="2"/><polygon points="80,30 92,18 92,63 80,75" fill="#1d4ed8" stroke="#94a3b8" stroke-width="2"/>`;
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${shape}<text x="60" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">${txt}</text></svg>`;
}
function tank(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="20" y="20" width="80" height="60" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="23" y="50" width="74" height="27" fill="#38bdf8"/><path d="M23 50q9-6 18 0t18 0 18 0 20 0" fill="none" stroke="#0369a1" stroke-width="2"/></svg>`;
}
function candy(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="10" y="35" width="100" height="32" rx="6" fill="#f472b6" stroke="#9d174d" stroke-width="2"/><rect x="52" y="35" width="16" height="32" fill="#fde047" stroke="#9d174d" stroke-width="2"/></svg>`;
}
function box3(L,W,H,clk){
 const y=200-16*H,x0=90,w=16*L,d=12*W;
 const top=`<polygon points="${x0},${y} ${x0+d},${y-d} ${x0+d+w},${y-d} ${x0+w},${y}" fill="#f97316" stroke="#94a3b8" stroke-width="2"${clk===false?'':' onclick="exBase()" style="cursor:pointer"'}/>`;
 const side=`<polygon points="${x0+w},${y} ${x0+d+w},${y-d} ${x0+d+w},${200-d} ${x0+w},200" fill="#1d4ed8" stroke="#94a3b8" stroke-width="2"/>`;
 const front=`<rect x="${x0}" y="${y}" width="${w}" height="${16*H}" fill="#2563eb" stroke="#94a3b8" stroke-width="2"/>`;
 const labels=`<text x="${x0+w/2}" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">الطول = ${L} سم</text><text x="${x0-8}" y="${y+8*H}" text-anchor="end" font-size="13" font-weight="bold" fill="#475569">الارتفاع = ${H} سم</text><text x="${x0+w/2+d/2}" y="${y-d-6}" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">العرض = ${W} سم</text>`;
 return `<rect width="360" height="240" fill="#f8fafc"/>`+top+side+front+labels;
}
function pic(t){
 if(t=='tri')return prismTri();
 if(t=='cyl')return cylPic();
 if(t=='pyr')return pyrPic();
 if(t=='box')return box('tot');
 if(t=='p60')return volPic('6 سم² × 10 سم',false);
 if(t=='p112')return volPic('16 سم² × 7 سم',false);
 if(t=='p120')return volPic('20 سم² × 6 سم',true);
 return '';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نحسب حجم الموشور معاً!');
 return `<div class="card c"><h1>حجم الموشور القائم</h1><p>سنلاحظ ونجرّب ونكتشف كيف نحسب حجم الموشور بضرب مساحة قاعدته في ارتفاعه.</p><div class="row">${prismTri()}${box('tot')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: الخزان يتكون من طبقات متطابقة',1],['في الصورة 1: كل طبقة أصغر من التي قبلها',0],['في الصورة 2: قاعدة الخزان مستطيل',1],['في الصورة 2: حجم الخزان هو مساحة قاعدته فقط',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>يريد يوسف ملء خزان ماء على شكل موشور قائم. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${layersPic()}الصورة 1</figure><figure>${box('base')}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.L=s.L??4;s.W=s.W??3;s.H=s.H??5;s.g=s.g||{};say('غيّر الأبعاد بالمنزلقات، واضغط على القاعدة البرتقالية. ماذا يحدث للحجم؟');
 return `<div class="card"><h2>نستكشف</h2><p>غيّر الطول والعرض والارتفاع لتكتشف 3 حقائق عن حجم متوازي المستطيلات.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p class="sl">الطول</p><input id="rgL" type="range" min="2" max="6" value="${s.L}" dir="ltr" aria-label="الطول"><p class="sl">العرض</p><input id="rgW" type="range" min="2" max="5" value="${s.W}" dir="ltr" aria-label="العرض"><p class="sl">الارتفاع</p><input id="rgH" type="range" min="2" max="8" value="${s.H}" dir="ltr" aria-label="الارتفاع"><div id="msg" class="msg"></div><div id="vals" class="tip"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد الموشور حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${prismTri()}<p><b class="b">ما الموشور القائم؟</b>: مجسّم له قاعدتان متطابقتان ومتوازيتان، وأوجه جانبية مستطيلة.</p></div><div>${box('tot')}<p><b class="o">الصيغة</b>: حجم الموشور = مساحة القاعدة × الارتفاع.</p></div><div>${triArea()}<p><b class="r">انتبه!</b> ارتفاع المثلث غير ارتفاع الموشور عند القاعدة المثلثة.</p></div></div><h3>أين نجده حولنا؟</h3><div class="exp"><figure>${tank()}<figcaption>خزان ماء</figcaption></figure><figure>${candy()}<figcaption>علبة حلوى طويلة</figcaption></figure><figure>${prismTri()}<figcaption>خيمة</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pic(r.pic)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: احسب مساحة القاعدة أولا، ثم اضربها في الارتفاع.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل حجم الموشور القائم.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">حجم الموشور = مساحة القاعدة × الارتفاع.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'حجم الموشور القائم =',post:'× الارتفاع.',a:'مساحة القاعدة',opts:['مساحة القاعدة','محيط القاعدة'],pic:'box',h:'الحجم يستعمل مساحة القاعدة لا محيطها.'},
 {pre:'مساحة المثلث = (القاعدة × الارتفاع) ÷',post:'',a:'2',opts:['2','3'],pic:'tri',h:'مساحة المثلث نصف مساحة المستطيل.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي تمثل موشوراً قائماً.',o:['tri','cyl','pyr'],a:0,why:'الموشور القائم له قاعدتان متطابقتان وأوجه جانبية مستطيلة.',h:'للموشور قاعدتان متطابقتان.'},
 {t:'ch',q:'ما صيغة حجم الموشور القائم؟',o:['مساحة القاعدة × الارتفاع','مساحة القاعدة + الارتفاع','محيط القاعدة × الارتفاع','مساحة القاعدة ÷ الارتفاع'],a:0,why:'الحجم = مساحة القاعدة × الارتفاع.',h:'الحجم طبقات متطابقة فوق القاعدة.'},
 {t:'ch',q:'متوازي مستطيلات طوله 5 سم وعرضه 4 سم وارتفاعه 3 سم. ما حجمه؟',o:['60 سم³','12 سم³','20 سم³','120 سم³'],a:0,why:'مساحة القاعدة = 5 × 4 = 20، والحجم = 20 × 3 = 60 سم³.',h:'مساحة القاعدة = 5 × 4، ثم اضرب في الارتفاع.'},
 {t:'mt',q:'اضغط على صورة، ثم على الحجم المناسب لها.',it:['p60','p112','p120'],W:['60 سم³','112 سم³','120 سم³'],ws:[2,0,1],why:'الحجم = مساحة القاعدة × الارتفاع.',h:'اضرب مساحة القاعدة في الارتفاع.'},
 {t:'rt',T:5,min:1,max:8,step:1,def:3,q:'حرّك المنزلق حتى يصبح حجم متوازي المستطيلات (قاعدته 4 سم × 3 سم) مساوياً لـ 60 سم³، ثم اضغط «تحقق».',why:'مساحة القاعدة = 12، و12 × 5 = 60 سم³.',h:'اقسم 60 على 12 لتجد الارتفاع.'},
 {t:'ch',q:'خزان ماء على شكل موشور قائم، قاعدته مستطيل 2 م في 3 م وارتفاعه 1,5 م. ما حجمه بالمتر المكعب؟',o:['9 م³','6 م³','4,5 م³','18 م³'],a:0,why:'مساحة القاعدة = 2 × 3 = 6، والحجم = 6 × 1,5 = 9 م³.',h:'مساحة القاعدة = 2 × 3، ثم اضرب في 1,5.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل الحجم هو مساحة القاعدة فقط؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],L=s.L,W=s.W,H=s.H,ba=L*W,v=ba*H;
 $('#ex').innerHTML=box3(L,W,H);
 $('#vals').textContent=`مساحة القاعدة = ${L} × ${W} = ${ba} سم² · الحجم = ${ba} × ${H} = ${v} سم³`;
 $('#msg').textContent=s.msg||'جرّب: غيّر الأبعاد بالمنزلقات، واضغط على القاعدة البرتقالية.';
 $('#chips').innerHTML=[['h','الحجم يكبر مع الارتفاع'],['base','الحجم يكبر مع مساحة القاعدة'],['click','احسب مساحة القاعدة أولا']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.h&&s.g.base&&s.g.click){s.done=1;nav();say('أحسنت! اكتشفت الحقائق الثلاث. هيا نفسّرها.')}}
function exBase(){const s=S[2];s.g.click=1;s.t=1;s.msg='هذه القاعدة: مساحتها = الطول × العرض. احسبها أولا ثم اضرب في الارتفاع.';exDraw();}
hooks[2]=()=>{const s=S[2],rgL=$('#rgL'),rgW=$('#rgW'),rgH=$('#rgH');
 rgL.oninput=()=>{s.L=+rgL.value;s.t=1;s.g.base=1;s.msg='غيّرت مساحة القاعدة، فتغير الحجم.';exDraw()};
 rgW.oninput=()=>{s.W=+rgW.value;s.t=1;s.g.base=1;s.msg='غيّرت مساحة القاعدة، فتغير الحجم.';exDraw()};
 rgH.oninput=()=>{s.H=+rgH.value;s.t=1;s.g.h=1;s.msg='غيّرت الارتفاع، فتغير الحجم.';exDraw()};
 exDraw()};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pic(o)}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`${q.p?`<div class="row">${q.p}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pic(o)}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??q.def;b=`<svg id="rs" viewBox="0 0 360 240" class="board"></svg><input id="rr" type="range" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${s.a}" dir="ltr" aria-label="القيمة"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الحجم المناسب لهذه الصورة.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليس هذا الحجم. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],rg=$('#rr');
 const d=()=>{const H=s.a;$('#rs').innerHTML=box3(4,3,H,false)+`<text x="180" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">الحجم = 12 × ${H} = ${12*H} سم³</text>`};
 d();rg.oninput=()=>{if(s.d)return;s.a=+rg.value;d()}};
function rchk(){const s=st(),q=Q[4];if(s.d)return;
 if(s.a===q.T)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
</body>
