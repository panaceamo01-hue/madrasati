<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حجم الأسطوانة – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
.sl{font-size:15px;font-weight:bold;color:#475569;text-align:center;margin:2px 0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');

/* رسومات */
function cylSmall(label){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="35" y="22" width="50" height="55" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="22" rx="25" ry="8" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="77" rx="25" ry="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>${label?`<text x="60" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#475569">${label}</text>`:''}</svg>`;
}
function cylRad(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="35" y="22" width="50" height="55" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="22" rx="25" ry="8" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="77" rx="25" ry="8" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>${L(60,22,85,22,'#16a34a',3)}<circle cx="60" cy="22" r="3" fill="#16a34a"/></svg>`;
}
function discsPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><ellipse cx="60" cy="28" rx="30" ry="9" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="50" rx="30" ry="9" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><ellipse cx="60" cy="72" rx="30" ry="9" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/></svg>`;
}
function diaPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="48" r="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>${L(28,48,92,48,'#dc2626',2,'stroke-dasharray="5 4"')}${L(60,48,92,48,'#16a34a',3)}<text x="60" y="95" text-anchor="middle" font-size="11" font-weight="bold" fill="#475569">القطر = 2 × نصف القطر</text></svg>`;
}
function sphPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><circle cx="60" cy="50" r="32" fill="#f97316" stroke="#92400e" stroke-width="2"/><ellipse cx="48" cy="38" rx="10" ry="7" fill="#fdba74"/></svg>`;
}
function boxPic(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><polygon points="25,35 40,20 95,20 80,35" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><polygon points="80,35 95,20 95,65 80,80" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/><rect x="25" y="35" width="55" height="45" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/></svg>`;
}
function pipe(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="20" y="38" width="80" height="26" fill="#2563eb" stroke="#1e40af" stroke-width="2"/><ellipse cx="20" cy="51" rx="8" ry="13" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/><ellipse cx="100" cy="51" rx="8" ry="13" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/></svg>`;
}
function tank(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="30" y="18" width="60" height="64" rx="8" fill="#fff" stroke="#475569" stroke-width="3"/><rect x="33" y="50" width="54" height="29" fill="#38bdf8"/><path d="M33 50q9-6 18 0t18 0 18 0" fill="none" stroke="#0369a1" stroke-width="2"/></svg>`;
}
function cylDraw(r,h,clk){
 const rx=25+15*r,bh=12*h;
 let g='<rect width="360" height="240" fill="#f8fafc"/>';
 g+=`<rect x="${180-rx}" y="70" width="${2*rx}" height="${bh}" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>`;
 g+=`<ellipse cx="180" cy="70" rx="${rx}" ry="14" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>`;
 g+=`<ellipse cx="180" cy="${70+bh}" rx="${rx}" ry="14" fill="#1d4ed8" stroke="#1e40af" stroke-width="2"/>`;
 g+=`<line x1="180" y1="70" x2="${180+rx}" y2="70" stroke="#16a34a" stroke-width="3"/>`;
 g+=`<circle cx="180" cy="70" r="4" fill="#16a34a"/>`;
 g+=`<line x1="${180-rx}" y1="70" x2="${180+rx}" y2="70" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"${clk===false?'':' onclick="exDia()" style="cursor:pointer"'}/>`;
 g+=`<text x="${180+rx/2}" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#16a34a">نصف القطر = ${r} سم</text>`;
 const r2=r*r,base=3.14*r2,v=3.14*r2*h;
 g+=`<text x="180" y="${70+bh+26}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">مساحة القاعدة = 3,14 × ${r2} = ${fmt(base)} سم²</text>`;
 g+=`<text x="180" y="${70+bh+46}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">الحجم = ${fmt(base)} × ${h} = ${fmt(v)} سم³</text>`;
 return g;
}
function pic(t){
 if(t=='cyl')return cylSmall('');
 if(t=='sph')return sphPic();
 if(t=='box')return boxPic();
 if(t=='dia')return diaPic();
 if(t=='v282')return cylSmall('3 سم × 10 سم');
 if(t=='v314')return cylSmall('5 سم × 4 سم');
 if(t=='v6')return cylSmall('1 م × 2 م');
 return '';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الهندسة. هيا نحسب حجم الأسطوانة معاً!');
 return `<div class="card c"><h1>حجم الأسطوانة</h1><p>سنلاحظ ونجرّب ونكتشف كيف نحسب حجم الأسطوانة باستعمال العدد π.</p><div class="row">${cylRad()}${discsPic()}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['في الصورة 1: قاعدة العلبة دائرة',1],['في الصورة 1: قاعدة العلبة مربع',0],['في الصورة 2: الأسطوانة تتكون من أقراص دائرية متطابقة',1],['في الصورة 2: الأقراص مختلفة الأحجام',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>علبة طماطم أسطوانية: كم تتسع؟ اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${cylRad()}الصورة 1</figure><figure>${discsPic()}الصورة 2</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.r=s.r??3;s.h=s.h??6;s.g=s.g||{};say('غيّر نصف القطر والارتفاع بالمنزلقين، واضغط على الخط الأحمر المتقطع. ماذا يحدث للحجم؟');
 return `<div class="card"><h2>نستكشف</h2><p>غيّر نصف القطر والارتفاع لتكتشف 3 حقائق عن حجم الأسطوانة. الخط الأخضر: نصف القطر، والخط الأحمر المتقطع: القطر.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p class="sl">نصف القطر</p><input id="rgR" type="range" min="1" max="5" value="${s.r}" dir="ltr" aria-label="نصف القطر"><p class="sl">الارتفاع</p><input id="rgH" type="range" min="2" max="10" value="${s.h}" dir="ltr" aria-label="الارتفاع"><div id="msg" class="msg"></div><div id="vals" class="tip"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نجد الأسطوانة حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${cylSmall('')}<p><b class="b">ما الأسطوانة؟</b>: مجسّم له قاعدتان دائرتان متطابقتان، وسطح جانبي منحني.</p></div><div>${cylRad()}<p><b class="o">الصيغة</b>: حجم الأسطوانة = π × نصف القطر² × الارتفاع، وπ ≈ 3,14.</p></div><div>${diaPic()}<p><b class="r">انتبه!</b> نصف القطر = القطر ÷ 2؛ لا تستعمل القطر مكان نصف القطر.</p></div></div><h3>أين نجدها حولنا؟</h3><div class="exp"><figure>${cylSmall('')}<figcaption>علبة</figcaption></figure><figure>${pipe()}<figcaption>أنبوب ماء</figcaption></figure><figure>${tank()}<figcaption>خزان ماء</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pic(r.pic)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.opts.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: ابدأ بحساب نصف القطر مربعاً، ثم اضرب في π، ثم في الارتفاع.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل حجم الأسطوانة.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">حجم الأسطوانة = 3,14 × نصف القطر² × الارتفاع، ونصف القطر = القطر ÷ 2.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'حجم الأسطوانة = π ×',post:'× الارتفاع.',a:'نصف القطر²',opts:['نصف القطر²','القطر'],pic:'cyl',h:'نستعمل نصف القطر مربعاً لا القطر.'},
 {pre:'نصف القطر = القطر ÷',post:'',a:'2',opts:['2','3'],pic:'dia',h:'نصف القطر هو نصف القطر.'}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي تمثل أسطوانة.',o:['cyl','sph','box'],a:0,why:'للأسطوانة قاعدتان دائرتان وسطح جانبي منحني.',h:'لها قاعدتان دائرتان.'},
 {t:'ch',q:'ما صيغة حجم الأسطوانة؟',o:['π × نصف القطر² × الارتفاع','π × القطر × الارتفاع','2 × π × نصف القطر','مساحة القاعدة + الارتفاع'],a:0,why:'الحجم = π × نصف القطر² × الارتفاع.',h:'الحجم = مساحة القاعدة × الارتفاع، ومساحة الدائرة = π × نصف القطر².'},
 {t:'ch',q:'أسطوانة نصف قطرها 2 سم وارتفاعها 5 سم. ما حجمها؟ (π ≈ 3,14)',o:['62,8 سم³','31,4 سم³','125,6 سم³','20 سم³'],a:0,why:'3,14 × 4 × 5 = 62,8 سم³.',h:'3,14 × 4 × 5.'},
 {t:'mt',q:'اضغط على صورة، ثم على الحجم المناسب لها.',it:['v282','v314','v6'],W:['282,6 سم³','314 سم³','6,28 م³'],ws:[2,0,1],why:'الحجم = 3,14 × نصف القطر² × الارتفاع.',h:'احسب نصف القطر مربعاً أولا.'},
 {t:'rt',T:5,min:1,max:10,step:1,def:4,q:'حرّك المنزلق حتى يصبح حجم الأسطوانة (نصف قطرها 2 سم) مساوياً لـ 62,8 سم³، ثم اضغط «تحقق».',why:'3,14 × 4 × 5 = 62,8 سم³.',h:'اقسم 62,8 على 12,56 لتجد الارتفاع.'},
 {t:'ch',q:'علبة أسطوانية قطرها 10 سم وارتفاعها 12 سم. ما حجمها؟ (π ≈ 3,14)',o:['942 سم³','376,8 سم³','1884 سم³','314 سم³'],a:0,why:'نصف القطر = 10 ÷ 2 = 5 سم، والحجم = 3,14 × 25 × 12 = 942 سم³.',h:'نصف القطر = القطر ÷ 2، أي 5 سم.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل قاعدة العلبة مربع فعلاً؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],r=s.r,h=s.h;
 $('#ex').innerHTML=cylDraw(r,h);
 $('#vals').textContent=`نصف القطر = ${r} سم · القطر = ${2*r} سم · الارتفاع = ${h} سم`;
 $('#msg').textContent=s.msg||'جرّب: غيّر نصف القطر والارتفاع بالمنزلقين، واضغط على الخط الأحمر المتقطع.';
 $('#chips').innerHTML=[['r','نصف القطر مربعاً يغير الحجم كثيراً'],['h','الحجم يتناسب مع الارتفاع'],['dia','القطر = 2 × نصف القطر']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.r&&s.g.h&&s.g.dia){s.done=1;nav();say('أحسنت! اكتشفت الحقائق الثلاث. هيا نفسّرها.')}}
function exDia(){const s=S[2];s.g.dia=1;s.t=1;s.msg=`هذا القطر: القطر = 2 × نصف القطر = ${2*s.r} سم. ونصف القطر = القطر ÷ 2.`;exDraw();}
hooks[2]=()=>{const s=S[2],rgR=$('#rgR'),rgH=$('#rgH');
 rgR.oninput=()=>{s.r=+rgR.value;s.t=1;s.g.r=1;s.msg='غيّرت نصف القطر، فتغير الحجم كثيراً لأن نصف القطر مربع.';exDraw()};
 rgH.oninput=()=>{s.h=+rgH.value;s.t=1;s.g.h=1;s.msg='غيّرت الارتفاع، فتغير الحجم بنفس النسبة.';exDraw()};
 exDraw()};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pic(o)}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`${q.p?`<div class="row">${q.p}</div>`:''}<div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pic(o)}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??q.def;b=`<svg id="rs" viewBox="0 0 360 240" class="board"></svg><input id="rr" type="range" min="${q.min}" max="${q.max}" step="${q.step||1}" value="${s.a}" dir="ltr" aria-label="القيمة"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر الحجم المناسب لهذه الصورة.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليس هذا الحجم. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],rg=$('#rr');
 const d=()=>{const h=s.a;$('#rs').innerHTML=cylDraw(2,h,false)};
 d();rg.oninput=()=>{if(s.d)return;s.a=+rg.value;d()}};
function rchk(){const s=st(),q=Q[4];if(s.d)return;
 if(s.a===q.T)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
</body>
</html>
