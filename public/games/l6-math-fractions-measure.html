<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأعداد الكسرية في القياس – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function meterSVG(num,den,cls){
 const w=280*num/den;
 let ticks='';
 [0,25,50,75,100].forEach(cm=>{
  const x=20+cm*2.8;
  ticks+=L(x,40,x,80,'#94a3b8',2)+`<text x="${x}" y="98" text-anchor="middle" font-size="11" fill="#475569">${cm}</text>`;
 });
 return `<svg viewBox="0 0 320 110" class="${cls||'st'}" role="img"><rect width="320" height="110" rx="14" fill="#f8fafc"/><rect x="20" y="40" width="280" height="40" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="20" y="40" width="${w}" height="40" rx="6" fill="#2563eb" opacity="0.85"/>${ticks}<text x="160" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">${num}/${den} متر = ${num/den*100} سنتيمترا</text></svg>`;
}
function bottleSVG(){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><rect x="50" y="12" width="20" height="12" rx="3" fill="#2563eb"/><path d="M48 24h24l6 14v44a8 8 0 0 1-8 8h-20a8 8 0 0 1-8-8V38z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><rect x="44" y="58" width="32" height="22" fill="#38bdf8"/><text x="60" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">1 لتر = 1000 مل</text></svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='mt-half')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">1/2 متر</text>`;
 if(t=='mt-quarter')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">1/4 لتر</text>`;
 if(t=='mt-three')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">3/4 كغ</text>`;
 if(t=='rule-liter')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="48" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">1/4 لتر = 250 مل</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#92400e">اللتر 1000 مل</text>`;
 if(t=='rule-add')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="48" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">1/2 + 1/4 = 3/4</text><text x="60" y="74" text-anchor="middle" font-size="13" fill="#92400e">النصف = ربعان</text>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة الكسور. هيا نتعلم الكسور في القياس معاً!');
 return `<div class="card c"><h1>الأعداد الكسرية في القياس</h1><p>سنلاحظ ونجرّب ونكتشف كيف نستعمل الكسور في قياس الأطوال والكتل والسعات.</p><div class="row">${tile('1/2 متر','= 50 سنتيمترا')}${tile('1/2 + 1/4','= 3/4')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['نصف المتر يساوي 50 سنتيمترا',1],['نصف المتر يساوي 5 سنتيمترات',0],['ربع المتر يساوي 25 سنتيمترا',1],['ربع المتر يساوي 40 سنتيمترا',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>شريط طوله متر واحد قسمناه إلى نصفين متساويين. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${meterSVG(1,2)}شريط طوله متر واحد</figure><figure>${bottleSVG()}قارورة سعتها لتر واحد</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.f=s.f??0;s.g=s.g||{};say('حرّك المنزلق لتغيير الكسر المظلل من المتر. كم سنتيمترا يساوي؟');
 return `<div class="card"><h2>نستكشف</h2><p>هذا شريط طوله متر واحد. ظلل منه النصف، ثم الربع، ثم ثلاثة أرباع، ولاحظ كم سنتيمترا يساوي كل جزء.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p style="text-align:center;font-weight:bold">الكسر المظلل: <span id="fv"></span></p><input id="rg" type="range" min="0" max="2" value="${s.f}" dir="ltr" aria-label="الكسر"><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل الكسور حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${meterSVG(1,2,'pic')}<p><b class="b">الكسر جزء من الوحدة</b>: نصف المتر هو 1/2 متر ويساوي 50 سنتيمترا، وربع المتر هو 1/4 متر ويساوي 25 سنتيمترا.</p></div><div>${bottleSVG()}<p><b class="o">الكسور في السعة والكتلة</b>: ربع اللتر 250 ملليلترا ونصفه 500 ملليلترا. وثلاثة أرباع الكيلوغرام 750 غراما.</p></div><div>${tile('1/2 + 1/4','= 3/4 متر')}<p><b class="r">جمع الكسور في القياس</b>: نوحد المقامين. النصف يساوي ربعين، إذن 1/2 + 1/4 = 3/4 متر.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${meterSVG(1,2,'pic')}<figcaption>نصف متر من القماش</figcaption></figure><figure>${bottleSVG()}<figcaption>ربع لتر من الماء</figcaption></figure><figure>${tile('3/4 كغ','= 750 غراما')}<figcaption>ثلاثة أرباع الكيلوغرام من السكر</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: اقسم الوحدة على المقام ثم اضرب في البسط.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل الكسور.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">النصف 50، والربع 25، وثلاثة أرباع 75 — ولجمع الكسور نوحد المقامين.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'ربع اللتر يساوي',a:'250',post:'ملليلترا.',t:'rule-liter',k:-12,h:'اللتر فيه 1000 ملليلتر، والربع هو 1000 ÷ 4 = 250.',o:['250','25']},
 {pre:'لجمع كسرين نوحد',a:'المقامين',post:'.',t:'rule-add',k:14,h:'النصف يساوي ربعين، ثم نجمع البسطين: 2/4 + 1/4 = 3/4.',o:['المقامين','البسطين']}];
const Q=[
 {t:'ch',q:'نصف متر يساوي كم سنتيمترا؟',o:['50 سنتيمترا','5 سنتيمترات','500 سنتيمتر'],a:0,why:'المتر 100 سنتيمتر، ونصفه 50 سنتيمترا.',h:'اقسم 100 على 2.'},
 {t:'ch',q:'ربع لتر يساوي كم ملليلترا؟',o:['250 ملليلترا','25 ملليلترا','100 ملليلتر'],a:0,why:'اللتر 1000 ملليلتر، وربعه 250 ملليلترا.',h:'اقسم 1000 على 4.'},
 {t:'ch',q:'ثلاثة أرباع الكيلوغرام تساوي كم غراما؟',o:['750 غراما','350 غراما','250 غراما'],a:0,why:'الكيلوغرام 1000 غرام، والربع الواحد 250 غراما، إذن 3 × 250 = 750.',h:'الربع الواحد 250 غراما.'},
 {t:'mt',q:'اضغط على صورة، ثم على القيمة المناسبة لها.',it:[['mt-half',20],['mt-quarter',-25],['mt-three',10]],W:['50 سنتيمترا','250 ملليلترا','750 غراما'],ws:[2,0,1],why:'1/2 متر = 50 سنتيمترا، و1/4 لتر = 250 ملليلترا، و3/4 كغ = 750 غراما.',h:'اقسم الوحدة على المقام ثم اضرب في البسط.'},
 {t:'rt',T:3,min:0,max:4,q:'حرّك المنزلق حتى يصبح طول الجزء المظلل 3/4 متر.',why:'3/4 متر تساوي 75 سنتيمترا.',h:'الربع الواحد 25 سنتيمترا، فثلاثة أرباع هي 75 سنتيمترا.'},
 {t:'ch',q:'ما ناتج 1/2 م + 1/4 م؟',o:['3/4 م','2/4 م','1 م'],a:0,why:'النصف يساوي ربعين: 2/4 + 1/4 = 3/4 م.',h:'النصف يساوي ربعين: 2/4 + 1/4.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: المتر فيه 100 سنتيمتر.',false)}}

/* 2: الاستكشاف */
const FRACS=[[1,2,50,'النصف'],[1,4,25,'الربع'],[3,4,75,'ثلاثة أرباع']];
function exDraw(){const s=S[2],[n,d,cm,txt]=FRACS[s.f];
 if(s.t){if(s.f==0)s.g.half=1;if(s.f==1)s.g.quarter=1;if(s.f==2)s.g.three=1}
 const w=280*n/d;
 $('#ex').innerHTML='<rect width="360" height="240" fill="#f8fafc"/><rect x="40" y="70" width="280" height="50" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/><rect x="40" y="70" width="'+w+'" height="50" rx="8" fill="#2563eb" opacity="0.85"/>'+[0,25,50,75,100].map(c=>L(40+c*2.8,70,40+c*2.8,120,'#94a3b8',2)+`<text x="${40+c*2.8}" y="140" text-anchor="middle" font-size="13" fill="#475569">${c}</text>`).join('')+`<text x="180" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">${n}/${d} متر = ${cm} سنتيمترا</text><text x="180" y="180" text-anchor="middle" font-size="17" font-weight="bold" fill="#475569">هذا الجزء هو ${txt} المتر</text>`;
