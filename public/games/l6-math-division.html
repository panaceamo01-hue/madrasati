<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القسمة – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function shareSVG(counts){
 let dots='';
 counts.forEach((n,r)=>{
  for(let k=0;k<n;k++){dots+=`<circle cx="${14+(k%12)*9}" cy="${16+r*22}" r="4" fill="${['#2563eb','#f97316','#16a34a','#7c3aed'][r%4]}"/>`}
 });
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${dots}</svg>`;
}
function friendsSVG(){
 let f='';
 [20,45,70,95].forEach((x,k)=>{
  f+=`<circle cx="${x}" cy="45" r="14" fill="#fde68a" stroke="#d97706" stroke-width="2"/><circle cx="${x-5}" cy="42" r="2" fill="#1e293b"/><circle cx="${x+5}" cy="42" r="2" fill="#1e293b"/><path d="M${x-6} 52q6 5 12 0" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>`;
 });
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${f}<text x="60" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">4 أصدقاء</text></svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='share-ok')return shareSVG([12,12,12,12]);
 if(t=='share-bad1')return shareSVG([12,12,12,6]);
 if(t=='share-bad2')return shareSVG([10,14,12,12]);
 if(t=='op-36')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">36 ÷ 6</text>`;
 if(t=='op-125')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">125 ÷ 5</text>`;
 if(t=='op-96')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">96 ÷ 12</text>`;
 if(t=='rule-div')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">47 = 5 × 9 + 2</text><text x="60" y="72" text-anchor="middle" font-size="13" fill="#92400e">خارج 9 والباقي 2</text>`;
 if(t=='rule-rem')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="45" text-anchor="middle" font-size="16" font-weight="bold" fill="#92400e">الباقي 2</text><text x="60" y="72" text-anchor="middle" font-size="13" fill="#92400e">أصغر من 5</text>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة القسمة. هيا نتعلم القسمة والخارج والباقي معاً!');
 return `<div class="card c"><h1>القسمة</h1><p>سنلاحظ ونجرّب ونكتشف كيف نقسم بالتساوي ونجد الخارج والباقي.</p><div class="row">${tile('48 ÷ 4','= 12')}${tile('47 = 5 × 9 + 2','الباقي 2')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['كل صديق يأخذ 12 حبة',1],['كل صديق يأخذ 14 حبة',0],['48 = 4 × 12',1],['يبقى 4 حبات بعد التوزيع',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>عندنا 48 حبة حلوى و4 أصدقاء. نريد توزيع الحلوى عليهم بالتساوي. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${shareSVG([12,12,12,12])}48 حبة حلوى</figure><figure>${friendsSVG()}4 أصدقاء</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.d=s.d??48;s.v=s.v??4;s.g=s.g||{};say('غيّر المنزلقين: الأول للمقسوم والثاني للمقسوم عليه. ماذا يحدث؟');
 return `<div class="card"><h2>نستكشف</h2><p>جرّب قسمة أعداد مختلفة واكتشف 3 حالات: قسمة مضبوطة، وقسمة بباقٍ، والتحقق بالضرب.</p><svg id="ex" viewBox="0 0 360 240" class="board"></svg><p style="text-align:center;font-weight:bold">المقسوم: <span id="dv"></span></p><input id="rg" type="range" min="20" max="60" value="${s.d}" dir="ltr" aria-label="المقسوم"><p style="text-align:center;font-weight:bold">المقسوم عليه: <span id="vv"></span></p><input id="rg2" type="range" min="2" max="9" value="${s.v}" dir="ltr" aria-label="المقسوم عليه"><div class="row"><button onclick="verifyDiv()">تحقق بالضرب</button></div><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل القسمة حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${shareSVG([12,12,12,12])}<p><b class="b">القسمة تقسيم بالتساوي</b>: في 48 ÷ 4 = 12، العدد 48 هو المقسوم، و4 هو المقسوم عليه، و12 هو خارج القسمة.</p></div><div>${tile('47 = 5 × 9 + 2','خارج 9 والباقي 2')}<p><b class="o">القسمة الإقليدية</b>: ليست كل قسمة مضبوطة؛ قد يبقى باقٍ أصغر من المقسوم عليه.</p></div><div>${tile('96 ÷ 12','= 8')}<p><b class="r">القسمة على عدد من رقمين</b>: نبحث عن العدد الذي إذا ضربناه في المقسوم عليه أعطانا المقسوم أو قريبا منه.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${shareSVG([8,8,8,8])}<figcaption>توزيع الحلوى على الأصدقاء</figcaption></figure><figure>${tile('250 ÷ 8','31 والباقي 2')}<figcaption>توزيع الدراهم بالتساوي</figcaption></figure><figure>${tile('96 ÷ 12','= 8 سيارات')}<figcaption>عدد السيارات لنقل التلاميذ</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: الباقي يجب أن يكون دائما أصغر من المقسوم عليه.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل القسمة.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">المقسوم = المقسوم عليه × الخارج + الباقي، والباقي أصغر من المقسوم عليه.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'في القسمة الإقليدية، المقسوم =',a:'المقسوم عليه',post:'× الخارج + الباقي.',t:'rule-div',k:-12,h:'المقسوم يساوي المقسوم عليه مضروبا في الخارج زائدا الباقي.',o:['المقسوم عليه','المقسوم']},
 {pre:'الباقي يجب أن يكون دائما',a:'أصغر',post:'من المقسوم عليه.',t:'rule-rem',k:14,h:'إذا كان الباقي أكبر من المقسوم عليه أو مساويا له، فالخارج غير صحيح.',o:['أصغر','أكبر']}];
const Q=[
 {t:'img',q:'اضغط على الصورة التي فيها 48 حبة موزعة بالتساوي على 4 أصدقاء.',o:[['share-bad1',25],['share-ok',-18],['share-bad2',8]],a:1,why:'في الصورة الصحيحة كل صديق يأخذ 12 حبة: 4 × 12 = 48.',h:'عد الحبات في كل صف: هل هي متساوية؟'},
 {t:'ch',q:'ما ناتج 36 ÷ 6؟',o:['6','5','9'],a:0,why:'6 × 6 = 36.',h:'فكر في جدول الضرب: 6 × ؟ = 36.'},
 {t:'ch',q:'ما ناتج 81 ÷ 9؟',o:['9','8','7'],a:0,why:'9 × 9 = 81.',h:'9 × ؟ = 81.'},
 {t:'mt',q:'اضغط على صورة، ثم على الخارج المناسب لها.',it:[['op-36',20],['op-125',-25],['op-96',10]],W:['6','25','8'],ws:[2,0,1],why:'36 ÷ 6 = 6، و125 ÷ 5 = 25، و96 ÷ 12 = 8.',h:'احسب كل قسمة أولا.'},
 {t:'rt',T:31,min:0,max:40,q:'حرّك المنزلق حتى يصبح 8 × ؟ = 248، فيكون خارج 250 ÷ 8 هو 31 والباقي 2.',why:'8 × 31 = 248، والباقي هو 250 − 248 = 2.',h:'ابحث عن العدد الذي إذا ضربناه في 8 أعطانا 248.'},
 {t:'ch',q:'ما خارج 58 ÷ 7 والباقي؟',o:['8 والباقي 2','8 والباقي 3','7 والباقي 2'],a:0,why:'7 × 8 = 56، والباقي هو 58 − 56 = 2.',h:'7 × 8 = 56، والباقي هو 58 − 56.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى: هل وزعت الحبات بالتساوي؟',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2],d=s.d,v=s.v,q=Math.floor(d/v),r=d%v;
 let k=null,m;
 if(r==0){k='exact';m='قسمة مضبوطة: '+d+' ÷ '+v+' = '+q+'، والباقي صفر.'}
 else{k='rem';m='قسمة بباقٍ: '+d+' ÷ '+v+' = '+q+'، والباقي '+r+'.'}
 if(k&&s.t)s.g[k]=1;
 if(s.vf){s.g.chk=1;m+=' التحقق: '+d+' = '+v+' × '+q+' + '+r+'.'}
 $('#ex').innerHTML='<rect width="360" height="240" fill="#f8fafc"/><text x="180" y="75" text-anchor="middle" font-size="30" font-weight="bold" fill="#1e293b">'+d+' ÷ '+v+' = '+q+'</text><text x="180" y="125" text-anchor="middle" font-size="26" font-weight="bold" fill="#f97316">الباقي: '+r+'</text>'+(s.vf?`<text x="180" y="180" text-anchor="middle" font-size="20" font-weight="bold" fill="#16a34a">${d} = ${v} × ${q} + ${r}</text>`:'');
 $('#dv').textContent=d;$('#vv').textContent=v;
 $('#msg').textContent=s.t?m:'جرّب: غيّر المنزلقين، ثم اضغط «تحقق بالضرب».';
