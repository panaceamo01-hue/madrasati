<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>البيانات: قراءة الجداول والمخططات وتأويلها – المستوى السادس ابتدائي</title>
<style>
:root{--b:#2563eb;--o:#f97316;--g:#16a34a;--r:#dc2626;--bg:#fff7e6;--ink:#1e293b}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Segoe UI","Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.7}
#app{max-width:780px;margin:0 auto;padding:0 10px 10px;min-height:100vh;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 4px}
.top{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#e2e8f0;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#84cc16);transition:width .4s}
#lab{font-size:14px;white-space:nowrap;font-weight:bold;color:#475569}
.mascot{display:flex;align-items:center;gap:8px;margin-top:6px}
.mascot svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border:3px solid var(--b);border-radius:18px;padding:6px 14px;flex:1;font-weight:bold;font-size:16px;line-height:1.5}
main{flex:1}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 #f1d9a8}
.c{text-align:center}
h1,h2,h3{margin:.2em 0;color:var(--b)}
h1{font-size:30px}h2{font-size:23px}h3{font-size:19px;color:#7c3aed}
p{margin:.4em 0}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;background:var(--b);color:#fff;font-weight:bold;box-shadow:0 4px 0 #1e40af}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #1e40af}
button:disabled{background:#cbd5e1;color:#64748b;box-shadow:0 4px 0 #94a3b8;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:4px solid #fbbf24;outline-offset:2px}
.big{font-size:22px;padding:12px 28px;background:var(--g);box-shadow:0 4px 0 #166534;margin-top:8px}
.nav{display:flex;gap:8px;padding:6px 0}
.nav button{flex:1;min-width:0;padding:10px 6px;font-size:16px}
#home{background:#7c3aed;box-shadow:0 4px 0 #5b21b6}
#retry{background:#f59e0b;box-shadow:0 4px 0 #b45309}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;margin:8px 0}
.row figure{margin:0;flex:1 1 240px;text-align:center;font-size:16px}
.opts{display:grid;gap:10px;margin:10px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.opt{background:#fff;color:var(--ink);border:3px solid #cbd5e1;box-shadow:none;text-align:right}
.pc{padding:4px;background:#fff;border:4px solid #cbd5e1;box-shadow:none;width:100%}
.pc.sel{border-color:var(--b);background:#dbeafe}
.opt.ok,.pc.ok,.chip.on{border-color:var(--g);background:#dcfce7;color:#14532d}
.opt.no,.pc.no{border-color:var(--r);background:#fee2e2;color:#7f1d1d}
.pic,.st{width:100%;max-width:200px;height:auto;display:block;margin:auto}
.st{max-width:340px}
.board{width:100%;max-width:520px;display:block;margin:6px auto;border:4px solid #bfdbfe;border-radius:14px;touch-action:none;background:#f8fafc}
input[type=range]{width:100%;max-width:520px;display:block;margin:6px auto;height:38px;accent-color:var(--o)}
.msg{background:#eff6ff;border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:bold;min-height:3.4em}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:2px 14px;border-radius:20px;border:3px solid #cbd5e1;background:#fff;font-size:15px;font-weight:bold}
.exp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0}
.exp figure,.exp div{margin:0;text-align:center;font-size:16px}
.b{color:var(--b)}.o{color:var(--o)}.r{color:var(--r)}
.rule{border:3px dashed #cbd5e1;border-radius:16px;padding:8px 12px;margin:10px 0}
.rule.ok{border:3px solid var(--g);background:#f0fdf4;display:flex;align-items:center;gap:12px}
.rule .mini{width:110px;flex:none}
.blank{display:inline-block;min-width:70px;border-bottom:4px solid var(--o);text-align:center;color:var(--o)}
.tip{background:#fef9c3;border-radius:12px;padding:8px 12px;font-weight:bold}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:bold}
.fb.ok{background:#dcfce7;border:2px solid var(--g)}
.fb.no{background:#fee2e2;border:2px solid var(--r)}
.cap{text-align:center;font-weight:bold;min-height:1.7em;color:var(--g)}
.score{font-size:34px;font-weight:bold;color:var(--o);margin:0}
@media(max-width:480px){body{font-size:17px}h1{font-size:26px}.rule .mini{width:80px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <div class="top"><div class="bar"><i id="bar"></i></div><span id="lab"></span></div>
 <div class="mascot">
  <svg viewBox="0 0 100 100" aria-hidden="true">
   <ellipse cx="50" cy="60" rx="36" ry="34" fill="#38bdf8"/><ellipse cx="50" cy="72" rx="22" ry="18" fill="#e0f2fe"/>
   <circle cx="36" cy="50" r="10" fill="#fff"/><circle cx="64" cy="50" r="10" fill="#fff"/>
   <circle cx="37" cy="51" r="5" fill="#1e293b"/><circle cx="63" cy="51" r="5" fill="#1e293b"/>
   <path d="M45 58h10l-5 8z" fill="#f97316"/>
   <path id="mouth" d="M40 72q10 8 20 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
   <path d="M16 22L50 8l34 14-34 14z" fill="#1e3a8a"/><path d="M82 24v16" stroke="#facc15" stroke-width="3"/>
  </svg>
  <div class="bubble" id="say"></div>
 </div>
</header>
<main id="stage"></main>
<nav class="nav">
 <button id="prev">السابق</button><button id="retry">إعادة المحاولة</button><button id="home">الرئيسية</button><button id="next">التالي</button>
</nav>
</div>
<script>
const S={},$=q=>document.querySelector(q);
const names=['الرئيسية','الوضعية المشكلة','الاستكشاف','التفسير','الاستنتاج','تقويم 1/6','تقويم 2/6','تقويم 3/6','تقويم 4/6','تقويم 5/6','تقويم 6/6','النتيجة'];
let i=0;
const st=()=>S[i]||(S[i]={});
const say=(t,ok)=>{$('#say').textContent=t;$('#mouth').setAttribute('d',ok===false?'M40 78q10-8 20 0':'M40 72q10 8 20 0')};
const L=(x1,y1,x2,y2,c,w=4,x='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${x}/>`;

/* رسومات */
const MONTHS=['يناير','فبراير','مارس','أبريل'];
const VALUES=[12,18,15,20];
const COLORS=['#2563eb','#f97316','#16a34a','#7c3aed'];
function tile(txt,sub){
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#2563eb">${txt}</text>${sub?`<text x="60" y="80" text-anchor="middle" font-size="14" fill="#475569">${sub}</text>`:''}</svg>`;
}
function tableSVG(){
 let rows='';
 MONTHS.forEach((m,r)=>{
  rows+=`<rect x="15" y="${12+r*20}" width="90" height="18" rx="4" fill="${r%2?'#eff6ff':'#fff'}" stroke="#cbd5e1"/><text x="60" y="${26+r*20}" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">${m}: ${VALUES[r]}</text>`;
 });
 return `<svg viewBox="0 0 120 100" class="pic" role="img"><rect width="120" height="100" rx="10" fill="#f8fafc"/>${rows}</svg>`;
}
function barsSVG(clicked){
 let b='';
 VALUES.forEach((v,k)=>{
  const h=v*7,x=20+k*80;
  b+=`<rect x="${x}" y="${210-h}" width="52" height="${h}" rx="6" fill="${COLORS[k]}" opacity="${clicked&&!clicked.includes(k)?0.45:1}"/><text x="${x+26}" y="${200-h}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">${clicked&&clicked.includes(k)?v:'؟'}</text><text x="${x+26}" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">${MONTHS[k]}</text>`;
 });
 return `<svg viewBox="0 0 360 240" class="board" role="img"><rect width="360" height="240" fill="#f8fafc"/>${b}</svg>`;
}
function sportsSVG(){
 const data=[['كرة القدم',14,'#2563eb'],['كرة السلة',8,'#f97316'],['السباحة',10,'#16a34a']];
 let b='';
 data.forEach(([n,v,c],k)=>{
  const h=v*10,y=190-h;
  b+=`<rect x="${50+k*100}" y="${y}" width="60" height="${h}" rx="6" fill="${c}"/><text x="${80+k*100}" y="${y-8}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">${v}</text><text x="${80+k*100}" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">${n}</text>`;
 });
 return `<svg viewBox="0 0 360 240" class="st" role="img"><rect width="360" height="240" rx="14" fill="#f8fafc"/>${b}</svg>`;
}
function pair(t,tilt=0,mark=false){
 let s=`<svg viewBox="0 0 120 100" class="pic" role="img"><g transform="rotate(${tilt} 60 50)">`;
 if(t=='mt-jan')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">يناير</text>`;
 if(t=='mt-mar')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">مارس</text>`;
 if(t=='mt-apr')s+=`<rect width="120" height="100" rx="10" fill="#f8fafc"/><text x="60" y="55" text-anchor="middle" font-size="22" font-weight="bold" fill="#2563eb">أبريل</text>`;
 if(t=='rule-table')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><text x="60" y="40" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">يناير: 12</text><text x="60" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">أبريل: 20</text>`;
 if(t=='rule-bar')s+=`<rect width="120" height="100" rx="10" fill="#fef3c7"/><rect x="25" y="55" width="18" height="30" fill="#2563eb"/><rect x="55" y="30" width="18" height="55" fill="#16a34a"/><rect x="85" y="45" width="18" height="40" fill="#f97316"/>`;
 return s+'</g></svg>';
}
const star=f=>`<svg viewBox="0 0 40 40" width="46" height="46"><path d="M20 3l5.2 11.4 12.3 1.4-9.2 8.4 2.6 12.2L20 30.2 9.1 36.4l2.6-12.2-9.2-8.4 12.3-1.4z" fill="${f?'#facc15':'#e2e8f0'}" stroke="${f?'#ca8a04':'#cbd5e1'}" stroke-width="2" stroke-linejoin="round"/></svg>`;

/* مراحل الدرس */
const hooks={};
const scr=[
// 0 الرئيسية
()=>{st().done=1;say('أهلاً يا بطل! أنا بومة البيانات. هيا نتعلم قراءة الجداول والمخططات معاً!');
 return `<div class="card c"><h1>البيانات: قراءة الجداول والمخططات وتأويلها</h1><p>سنلاحظ ونجرّب ونكتشف كيف نقرأ جدولا ومخططا ونستخلص منهما نتائج.</p><div class="row">${tile('12 + 18 + 15 + 20','= 65 كتابا')}${tile('العمود الأطول','= العدد الأكبر')}</div><button class="big" onclick="go(1)">ابدأ اللعب</button></div>`},
// 1 الوضعية المشكلة
()=>{const s=st();s.f=s.f||[];s.w=s.w||[];say('انظر جيداً إلى الصورتين. ماذا تلاحظ؟');
 const o=[['أكثر شهر هو أبريل (20 كتابا)',1],['أكثر شهر هو فبراير',0],['أقل شهر هو يناير (12 كتابا)',1],['مجموع الكتب 60 كتابا',0]];
 return `<div class="card"><h2>الوضعية المشكلة</h2><p>سجل فصلنا عدد الكتب التي قرأها التلاميذ كل شهر. اضغط على كل ملاحظة صحيحة.</p><div class="row"><figure>${tableSVG()}جدول الكتب المقروءة</figure><figure>${barsSVG(null)}مخطط الكتب المقروءة</figure></div><div class="opts">${o.map((x,k)=>`<button class="opt${s.f.includes(k)?' ok':s.w.includes(k)?' no':''}" ${s.f.includes(k)||s.w.includes(k)?'disabled':''} onclick="obs(${k},${x[1]})">${x[0]}</button>`).join('')}</div></div>`},
// 2 الاستكشاف
()=>{const s=st();s.ck=s.ck||[];s.g=s.g||{};say('اضغط على كل عمود لتعرف عدد كتبه. أي عمود أطول؟ وأي عمود أقصر؟');
 return `<div class="card"><h2>نستكشف</h2><p>اضغط على الأعمدة واحدا واحدا، واكتشف أطول عمود وأقصر عمود ومجموع الكتب.</p><div id="exwrap">${barsSVG(s.ck)}</div><div id="msg" class="msg"></div><div class="chips" id="chips"></div></div>`},
// 3 التفسير
()=>{st().done=1;say('اقرأ البطاقات، ثم انظر أين نستعمل الجداول والمخططات حولنا.');
 return `<div class="card"><h2>نفسّر ما اكتشفناه</h2><div class="exp"><div>${tableSVG()}<p><b class="b">الجدول</b>: ينظم البيانات في صفوف وأعمدة. لقراءة معلومة، نبحث عن تقاطع الصف والعمود.</p></div><div>${barsSVG([0,1,2,3])}<p><b class="o">مخطط الأعمدة</b>: يمثل كل عدد بعمود. العمود الأطول يمثل العدد الأكبر، والأقصر يمثل الأصغر.</p></div><div>${tile('12 + 18 + 15 + 20','= 65 كتابا')}<p><b class="r">التأويل</b>: بعد قراءة البيانات، نحسب المجموع والفرق، ثم نستخلص نتيجة.</p></div></div><h3>أين نستعملها حولنا؟</h3><div class="exp"><figure>${tableSVG()}<figcaption>عدد الكتب المقروءة كل شهر</figcaption></figure><figure>${sportsSVG()}<figcaption>الرياضة المفضلة لدى التلاميذ</figcaption></figure><figure>${tile('أبريل: 20 كتابا','أكثر شهر قراءة')}<figcaption>استخلاص النتائج من البيانات</figcaption></figure></div></div>`},
// 4 الاستنتاج
()=>{const s=st();s.r=s.r||[0,0];say('أكمل القاعدتين باختيار الكلمة المناسبة.');
 return `<div class="card"><h2>نستنتج القاعدتين</h2>${R.map((r,k)=>s.r[k]?`<div class="rule ok"><div class="mini">${pair(r.t,r.k,1)}</div><p>${r.pre} <b>${r.a}</b> ${r.post}</p></div>`:`<div class="rule"><p>${r.pre} <span class="blank">؟؟؟</span> ${r.post}</p><div class="row">${r.o.map(w=>`<button class="opt" onclick="rl(${k},'${w}')">${w}</button>`).join('')}</div></div>`).join('')}<p class="tip">تذكّر: اقرأ عنوان المخطط أولا لتعرف ماذا يمثل.</p></div>`},
...Array.from({length:6},(_,n)=>()=>quiz(n)),
// 11 النتيجة
()=>{let sc=0;for(let k=5;k<11;k++)sc+=S[k]?.sc||0;st().done=1;
 const m=sc>=5?'ممتاز! أنت بطل البيانات.':sc>=3?'جيد جداً! راجع التفسير ثم حاول مجدداً.':'لا بأس! أعد المحاولة وسنتحسّن معاً.';say(m);
 return `<div class="card c"><h1>النتيجة النهائية</h1><div class="row">${[...Array(6)].map((_,k)=>star(k<sc)).join('')}</div><p class="score">${sc} / 6</p><p>${m}</p><p class="tip">اقرأ الجدول من تقاطع الصف والعمود، وقارن أطوال الأعمدة في المخطط.</p><button class="big" onclick="reset()">العب من جديد</button></div>`}
];

/* بيانات الاستنتاج والتقويم */
const R=[{pre:'لقراءة معلومة في الجدول نبحث عن تقاطع',a:'الصف والعمود',post:'.',t:'rule-table',k:-12,h:'كل معلومة في الجدول توجد عند تقاطع صف وعمود.',o:['الصف والعمود','العنوان والألوان']},
 {pre:'العمود الأطول في المخطط يمثل العدد',a:'الأكبر',post:'.',t:'rule-bar',k:14,h:'يكفي أن نقارن أطوال الأعمدة لنعرف الترتيب دون قراءة الأعداد.',o:['الأكبر','الأصغر']}];
const Q=[
 {t:'ch',q:'في جدول الكتب المقروءة، في أي شهر قرأ التلاميذ أكبر عدد من الكتب؟',o:['أبريل','يناير','مارس'],a:0,why:'في أبريل قرأ التلاميذ 20 كتابا، وهو أكبر عدد.',h:'ابحث عن أكبر عدد في الجدول.'},
 {t:'ch',q:'كم كتابا قرأ التلاميذ في شهر فبراير؟',o:['18 كتابا','15 كتابا','12 كتابا'],a:0,why:'في فبراير قرأ التلاميذ 18 كتابا.',h:'ابحث عن صف فبراير في الجدول.'},
 {t:'ch',q:'ما الفرق بين عدد الكتب في أبريل ويناير؟',o:['8 كتب','5 كتب','10 كتب'],a:0,why:'20 − 12 = 8 كتب.',h:'اطرح 12 من 20.'},
 {t:'mt',q:'اضغط على صورة، ثم على عدد الكتب المناسب لها.',it:[['mt-jan',20],['mt-mar',-25],['mt-apr',10]],W:['12 كتابا','15 كتابا','20 كتابا'],ws:[2,0,1],why:'يناير 12 كتابا، ومارس 15 كتابا، وأبريل 20 كتابا.',h:'اقرأ الجدول أولا.'},
 {t:'rt',T:18,min:10,max:25,q:'حرّك المنزلق ليصبح عدد كتب فبراير هو العدد الصحيح، فيصبح مجموع الكتب 65 كتابا.',why:'12 + 18 + 15 + 20 = 65 كتابا.',h:'المجموع 65، فعدد فبراير هو 65 − 12 − 15 − 20 = 18.'},
 {t:'ch',p:sportsSVG(),q:'في مخطط الأعمدة: كرة القدم 14 تلميذا، وكرة السلة 8، والسباحة 10. أي رياضة أقل تفضيلا؟',o:['كرة السلة','السباحة','كرة القدم'],a:0,why:'كرة السلة يفضلها 8 تلاميذ فقط، وهو أقل عدد.',h:'ابحث عن أقصر عمود في المخطط.'}
];

/* تنقّل */
function render(){S[i]||(S[i]={});$('#stage').innerHTML=scr[i]();hooks[i]&&hooks[i]();$('#bar').style.width=i/11*100+'%';$('#lab').textContent=names[i];nav()}
function nav(){$('#prev').disabled=i==0;$('#next').disabled=!S[i].done;$('#next').style.display=i==11?'none':'';$('#retry').style.display=(i==0||i==3||i==11)?'none':''}
const go=n=>{i=n;render();scrollTo(0,0)};
const reset=()=>{for(const k in S)delete S[k];go(0)};
$('#prev').onclick=()=>go(i-1);$('#next').onclick=()=>go(i+1);$('#home').onclick=()=>go(0);
$('#retry').onclick=()=>{delete S[i];render()};

/* 1: الملاحظة */
function obs(k,ok){const s=st();
 if(ok){s.f.push(k);render();if(s.f.length==2){s.done=1;nav();say('رائع! لاحظت الفرق بين الصورتين. هيا نجرّب بأنفسنا.')}else say('ملاحظة صحيحة! هل من ملاحظة أخرى؟')}
 else{s.w.push(k);render();say('انظر مرة أخرى إلى الجدول والمخطط.',false)}}

/* 2: الاستكشاف */
function exDraw(){const s=S[2];
 if(s.ck.includes(3))s.g.tall=1;
 if(s.ck.includes(0))s.g.short=1;
 if(s.ck.length==4)s.g.sum=1;
 const wrap=$('#exwrap');
 if(wrap){let b='';
  VALUES.forEach((v,k)=>{
   const h=v*7,x=20+k*80;
   b+=`<rect x="${x}" y="${210-h}" width="52" height="${h}" rx="6" fill="${COLORS[k]}" style="cursor:pointer" onclick="barClick(${k})"/><text x="${x+26}" y="${200-h}" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">${s.ck.includes(k)?v:'؟'}</text><text x="${x+26}" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#475569">${MONTHS[k]}</text>`;
  });
  wrap.innerHTML=`<svg viewBox="0 0 360 240" class="board" role="img"><rect width="360" height="240" fill="#f8fafc"/>${b}</svg>`}
 const last=s.last;
 $('#msg').textContent=last!=null?('في شهر '+MONTHS[last]+' قرأ التلاميذ '+VALUES[last]+' كتابا.'+(s.ck.length==4?' والمجموع: 12 + 18 + 15 + 20 = 65 كتابا.':'')):'اضغط على الأعمدة واحدا واحدا لتعرف عدد الكتب في كل شهر.';
 $('#chips').innerHTML=[['tall','أبريل: أطول عمود'],['short','يناير: أقصر عمود'],['sum','المجموع 65 كتابا']].map(([c,t])=>`<span class="chip${s.g[c]?' on':''}">${t}</span>`).join('');
 if(!s.done&&s.g.tall&&s.g.short&&s.g.sum){s.done=1;nav();say('أحسنت! اكتشفت الحالات الثلاث. هيا نفسّرها.')}}
function barClick(k){const s=S[2];if(!s.ck.includes(k))s.ck.push(k);s.last=k;exDraw()}
hooks[2]=()=>{exDraw()};

/* 4: الاستنتاج */
function rl(k,w){const s=st();
 if(w==R[k].a){s.r[k]=1;render();if(s.r[0]&&s.r[1]){s.done=1;nav();say('أحسنت! استنتجنا القاعدتين. هيا نختبر أنفسنا.')}else say('صحيح! بقيت قاعدة واحدة.')}
 else say(R[k].h,false)}

/* 5-10: التقويم */
function quiz(n){const q=Q[n],s=st();s.w=s.w||[];
 say(s.d?'أحسنت يا بطل!':s.bad?'حاول مرة أخرى، أنت قادر!':'فكّر جيداً ثم أجب.',!(s.bad&&!s.d));
 const dis=k=>s.d||s.w.includes(k)?'disabled':'',cl=k=>(s.d&&k==q.a?' ok':'')+(s.w.includes(k)?' no':'');
 let b='';
 if(q.t=='img')b=`<div class="grid3">${q.o.map((o,k)=>`<button class="pc${cl(k)}" ${dis(k)} onclick="ans(${k})" aria-label="صورة ${k+1}">${pair(o[0],o[1])}</button>`).join('')}</div>`;
 if(q.t=='ch')b=`<div class="row">${q.p||''}</div><div class="opts">${q.o.map((o,k)=>`<button class="opt${cl(k)}" ${dis(k)} onclick="ans(${k})">${o}</button>`).join('')}</div>`;
 if(q.t=='mt'){s.m=s.m||[0,0,0];b=`<div class="grid3">${q.it.map((o,k)=>`<div><button class="pc${s.m[k]?' ok':''}${s.si===k?' sel':''}" ${s.m[k]?'disabled':''} onclick="pI(${k})">${pair(o[0],o[1])}</button><div class="cap">${s.m[k]?q.W[k]:'؟'}</div></div>`).join('')}</div><div class="opts">${q.ws.map(w=>`<button class="opt${s.m[w]?' ok':''}" ${s.m[w]?'disabled':''} onclick="pW(${w})">${q.W[w]}</button>`).join('')}</div>`}
 if(q.t=='rt'){s.a=s.a??15;b=`<svg id="rs" viewBox="0 0 360 220" class="board"></svg><input id="rr" type="range" min="${q.min}" max="${q.max}" value="${s.a}" dir="ltr" aria-label="عدد كتب فبراير"><div class="row"><button onclick="rchk()" ${s.d?'disabled':''}>تحقق</button></div>`}
 if(s.d)st().done=1;
 return `<div class="card"><h2>التطبيق والتقويم</h2><p><b>${q.q}</b></p>${b}${s.fb?`<div class="fb ${s.fb.ok?'ok':'no'}">${s.fb.t}</div>`:''}</div>`}
function fin(s,q){s.d=1;s.done=1;if(!s.bad)s.sc=1;s.fb={ok:1,t:'صحيح! '+q.why}}
function ans(k){const q=Q[i-5],s=st();if(s.d)return;
 if(k==q.a)fin(s,q);else{s.bad=1;s.w.push(k);s.fb={ok:0,t:'ليست هذه الإجابة. تلميح: '+q.h}}
 render()}
function pI(k){const s=st();s.si=k;s.fb=null;render();say('اختر عدد الكتب المناسب لهذا الشهر.')}
function pW(w){const s=st(),q=Q[3];
 if(s.si==null){say('اضغط أولاً على صورة.',false);return}
 if(w==s.si){s.m[w]=1;s.si=null;s.fb=null;if(s.m.every(x=>x))fin(s,q)}
 else{s.bad=1;s.fb={ok:0,t:'ليست هذه الكلمة. تلميح: '+q.h}}
 render()}
hooks[9]=()=>{const s=S[9],q=Q[4],rg=$('#rr');
 const d=()=>{const v=s.a,tot=12+v+15+20;
 $('#rs').innerHTML='<rect width="360" height="220" fill="#f8fafc"/><text x="180" y="60" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">12 + '+v+' + 15 + 20</text><text x="180" y="105" text-anchor="middle" font-size="30" font-weight="bold" fill="#16a34a">= '+tot+' كتابا</text>'+L(30,160,330,160,'#cbd5e1',6)+L(30,160,30+((v-10)/15)*300,160,'#2563eb',6)+`<circle cx="${30+((v-10)/15)*300}" cy="160" r="10" fill="#f97316"/><text x="180" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#475569">عدد كتب فبراير: ${v} — المطلوب: المجموع 65</text>`};
 d();rg.oninput=()=>{if(s.d)return;let a=+rg.value;if(Math.abs(a-q.T)<=1)a=q.T;s.a=a;rg.value=a;d()}};
function rchk(){const s=st(),q=Q[4];if(s.d)return;
 if(Math.abs(s.a-q.T)<=1)fin(s,q);else{s.bad=1;s.fb={ok:0,t:'ليس بعد. تلميح: '+q.h}}
 render()}

render();
</script>
